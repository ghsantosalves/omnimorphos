  if(m.t==='hello'){if(G&&ONLINE())return;DECKS['__online']={desc:'',list:m.list,hidden:true};NET.ref.child('status').set('playing');
    $('#start').style.display='none';startGame({mode:'online',d1:deckKey,d2:'__online',n1:name||'Anfitrião',n2:m.name||'Convidado',label2:m.deck});return}
  if(m.t==='ans'){const f=NET.pending.get(m.id);if(f){NET.pending.delete(m.id);f(netDec(JSON.parse(m.r),u=>INST.get(+u)||INST.get(u)))}return}
  if(m.t==='act'){if(G&&ONLINE()&&!G.over&&!G.busy&&G.active===1){const c=m.uid!=null?INST.get(+m.uid):null;await doAct(P[1],m.act,c)}NET.last='';netFlushNow()}}
// ----- convidado -----
async function netJoin(code,name,deckKey){await netInit();code=code.trim().toUpperCase();
  const r=NET.db.ref('rooms/'+code);const snap=await r.once('value');const v=snap.val();
  if(!v)throw new Error('Sala não encontrada. Confira o código.');if(v.guest&&v.guest!==NET.uid)throw new Error('Essa sala já tem dois jogadores.');if(v.status==='closed')throw new Error('Essa sala foi fechada.');
  if(!v.guest)await r.child('guest').set(NET.uid);NET.ref=r;NET.code=code;NET.role='guest';
  r.child('toHost/bye').onDisconnect().set(true);
  const onState=s=>{const st=s.val();if(st)NET.q=NET.q.then(()=>guestApply(st))};
  const onMsg=s=>{const m=s.val();if(m&&m.t==='ask')NET.q=NET.q.then(()=>guestPrompt(m)).catch(e=>console.error(e))};
  const onStatus=s=>{if(s.val()==='closed'&&!(G&&G.over))netAlert('O anfitrião saiu da partida.')};
  r.child('toGuest/s').on('value',onState);r.child('toGuest/m').on('child_added',onMsg);r.child('status').on('value',onStatus);
  NET.subs.push(()=>{r.child('toGuest/s').off('value',onState);r.child('toGuest/m').off('child_added',onMsg);r.child('status').off('value',onStatus)});
  netSend({t:'hello',name,deck:deckKey,list:DECKS[deckKey].list})}
function guestApply(str){if(!str||str===NET.last)return;NET.last=str;const s=JSON.parse(str);
  INST.clear();const cards={};for(const u in s.C){const o=s.C[u];const c=Object.assign({},o,{d:DEF[o.id]});cards[u]=c;INST.set(c.uid,c)}
  P=s.P.map(o=>Object.assign({},o));const gc=u=>cards[u];
  for(const c of Object.values(cards))for(const k in c)if(k!=='d')c[k]=netDec(c[k],gc);
  for(const p of P)for(const k in p)p[k]=netDec(p[k],gc);
  G=netDec(s.G,gc);VIEW=1;$('#start').style.display='none';
  const L=$('#log');L.innerHTML='';for(const[msg,cls]of s.L){const el=document.createElement('div');if(cls)el.className=cls;el.textContent=msg;L.appendChild(el)}L.scrollTop=L.scrollHeight;
  render();
  if(G.over&&G.winnerId!==undefined&&!NET.overShown){NET.overShown=true;gameOver(G.winnerId===null?null:P[G.winnerId])}}
async function guestPrompt(m){guestApply(m.s);const a=netDec(JSON.parse(m.a),u=>INST.get(+u)||INST.get(u));let r=null;
  try{if(m.kind==='ask')r=await ask(a[0],a[1]||[],a[2]||{});else if(m.kind==='askMulti')r=await askMulti(a[0],a[1]||[],a[2],a[3],a[4]);
    else if(m.kind==='askBlock')r=await askBlock(a[0],a[1]||[],a[2]||[],a[3]);else if(m.kind==='askResponse')r=await askResponse(a[0],a[1],a[2],a[3]||[])}
  catch(e){console.error(e)}
  const enc=netEnc(r);netSend({t:'ans',id:m.id,r:JSON.stringify(enc===undefined?null:enc)})}
function netAlert(msg){const m=document.createElement('div');m.className='modal-bg';m.innerHTML=`<div class="modal" style="text-align:center"><h3>Partida online</h3><p>${esc(msg)}</p><button class="btn primary">Voltar ao início</button></div>`;
  m.querySelector('button').onclick=()=>{m.remove();netLeave();G=null;showStart()};document.body.appendChild(m)}
function netLeave(){try{NET.subs.forEach(f=>f());if(NET.ref){if(NET.role==='host')NET.ref.remove().catch(()=>{});else NET.ref.child('toHost/bye').set(true).catch(()=>{})}}catch(e){}
  Object.assign(NET,{role:null,code:null,ref:null,pending:new Map(),waiting:0,last:'',q:Promise.resolve(),overShown:false,subs:[]});delete DECKS['__online']}

/* ============================ INÍCIO ============================ */
const STORE_KEY='omni_decks_v1';
function loadCustom(){let o={};try{o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}')||{}}catch(e){o={}}
  for(const k of Object.keys(DECKS))if(DECKS[k].custom)delete DECKS[k];
  for(const[n,list]of Object.entries(o)){const l=list.filter(([id])=>DEF[id]);DECKS[n]={desc:'Baralho personalizado',list:l,custom:true}}}
function saveCustom(){const o={};for(const[k,v]of Object.entries(DECKS))if(v.custom)o[k]=v.list;try{localStorage.setItem(STORE_KEY,JSON.stringify(o));return true}catch(e){return false}}
const deckSize=k=>DECKS[k].list.reduce((s,[,n])=>s+n,0);
const UI={mode:'ai',d1:'Atharvash',d2:'random',diff:'normal'};
function showStart(){
  loadCustom();const st=$('#start');st.style.display='grid';
  const deckBtns=(sel,name,withRandom)=>Object.keys(DECKS).filter(k=>!DECKS[k].hidden).map(k=>{const c=DECKS[k].custom?'x':k;const n=deckSize(k);return`<div class="deck c-${c} ${sel===k?'sel':''}" data-${name}="${esc(k)}" ${DECKS[k].custom?'style="--cc:#9b6cd3"':''}><h3>${esc(k)}</h3><p>${esc(DECKS[k].desc)}</p><p class="muted">${n} cartas${n<60?' · <b style="color:#ff9b88">incompleto</b>':''}</p></div>`}).join('')+(withRandom?`<div class="deck c-x ${sel==='random'?'sel':''}" data-${name}="random" style="--cc:#7f7569"><h3>Aleatório</h3><p>Um dos baralhos iniciais.</p></div>`:'');
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="btn ${UI[key]===v||RULES[key]===v?'primary':''}" data-set="${key}" data-val="${v}">${l}</button>`).join('')}</div>`;
  const draw_=()=>{const hot=UI.mode==='hot';if(hot&&UI.d2==='random')UI.d2='Gaia';
    if(UI.mode==='online'){drawOnline();return}
    st.innerHTML=`<div class="box"><h1>OMNIMORPHOS</h1><div class="sub">1ª edição · versão digital</div>
    <div class="lbl">Modo de jogo</div>${seg('mode',[['ai','Contra o computador'],['hot','2 jogadores (mesmo computador)'],['online','🌐 Online (código de sala)']])}
    ${hot?'':`<div class="lbl">Dificuldade</div>${seg('diff',[['facil','Fácil'],['normal','Normal'],['dificil','Difícil']])}`}
    <div class="lbl">${hot?'Baralho do Jogador 1':'Seu baralho'}</div><div class="decks">${deckBtns(UI.d1,'d1',false)}</div>
    <div class="lbl">${hot?'Baralho do Jogador 2':'Baralho do oponente (computador)'}</div><div class="decks">${deckBtns(UI.d2,'d2',!hot)}</div>
    <p style="margin-top:18px"><button class="btn primary" id="go" style="font-size:17px;padding:10px 28px">Jogar</button> <button class="btn" id="ed">Editor de baralhos</button></p><p>${opt3dHTML()}</p>
    <p class="muted" id="warn"></p>
    <details class="rules"><summary><b>Como jogar</b></summary>${RULES_HTML}</details></div>`;
    st.querySelectorAll('[data-d1]').forEach(el=>el.onclick=()=>{UI.d1=el.dataset.d1;draw_()});
    st.querySelectorAll('[data-d2]').forEach(el=>el.onclick=()=>{UI.d2=el.dataset.d2;draw_()});
    st.querySelectorAll('[data-set]').forEach(el=>el.onclick=()=>{const k=el.dataset.set,v=el.dataset.val;if(k==='xpMode')RULES.xpMode=v;else UI[k]=v;draw_()});
    $('#ed').onclick=()=>showEditor();
    $('#go').onclick=()=>{const starters=Object.keys(DECKS).filter(k=>!DECKS[k].custom);const d2=UI.d2==='random'?starters[rnd(starters.length)]:UI.d2;
      const bad=[UI.d1,d2].find(k=>deckSize(k)<60);if(bad){$('#warn').textContent=`O baralho "${bad}" tem menos de 60 cartas. Complete-o no editor.`;return}
      st.style.display='none';startGame({mode:UI.mode,d1:UI.d1,d2,diff:UI.diff})}};
  const drawOnline=()=>{const nm=(()=>{try{return localStorage.getItem('omni_name')||''}catch(e){return''}})();
    st.innerHTML=`<div class="box"><h1>OMNIMORPHOS</h1><div class="sub">1ª edição · versão digital</div>
    <div class="lbl">Modo de jogo</div>${seg('mode',[['ai','Contra o computador'],['hot','2 jogadores (mesmo computador)'],['online','🌐 Online (código de sala)']])}
    <div class="lbl">Seu nome</div><input id="onm" class="inp" maxlength="18" placeholder="Seu nome" value="${esc(nm)}">
    <div class="lbl">Seu baralho</div><div class="decks">${deckBtns(UI.d1,'d1',false)}</div>
    <div class="online-box"><div><button class="btn primary" id="mk" style="font-size:16px;padding:9px 22px">Criar sala</button><p class="muted">Gera um código para enviar ao seu amigo.</p></div>
      <div><div style="display:flex;gap:6px;justify-content:center"><input id="ocode" class="inp" maxlength="6" placeholder="CÓDIGO" style="width:120px;text-transform:uppercase;text-align:center;letter-spacing:3px"><button class="btn" id="jn">Entrar</button></div><p class="muted">Digite o código que seu amigo enviou.</p></div></div>
    <p id="ost" class="ost"></p>
    <p>${opt3dHTML()}</p></div>`;
    const name=()=>{const v=($('#onm').value||'').trim().slice(0,18);try{localStorage.setItem('omni_name',v)}catch(e){}return v};
    st.querySelectorAll('[data-d1]').forEach(el=>el.onclick=()=>{UI.d1=el.dataset.d1;drawOnline()});
    st.querySelectorAll('[data-set]').forEach(el=>el.onclick=()=>{const k=el.dataset.set,v=el.dataset.val;UI[k]=v;draw_()});
    const ost=t=>{$('#ost').innerHTML=t};
    $('#mk').onclick=async()=>{if(deckSize(UI.d1)<60){ost('Complete o baralho no editor (mínimo 60 cartas).');return}const n=name()||'Anfitrião';ost('Criando sala…');$('#mk').disabled=true;$('#jn').disabled=true;
      try{const code=await netHost(n,UI.d1);ost(`Código da sala: <b class="code">${code}</b> <button class="btn" id="cp">Copiar</button><br>Envie para o seu amigo. Aguardando ele entrar… <button class="btn" id="cx">Cancelar</button>`);
        $('#cp').onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}};$('#cx').onclick=()=>{netLeave();drawOnline()}}
      catch(e){ost('⚠ '+esc(e.message||String(e)));$('#mk').disabled=false;$('#jn').disabled=false}};
    $('#jn').onclick=async()=>{const code=($('#ocode').value||'').trim();if(code.length<4){ost('Digite o código da sala.');return}if(deckSize(UI.d1)<60){ost('Complete o baralho no editor (mínimo 60 cartas).');return}
      const n=name()||'Convidado';ost('Entrando…');$('#mk').disabled=true;$('#jn').disabled=true;
      try{await netJoin(code,n,UI.d1);ost('Conectado! Aguardando o anfitrião começar a partida…')}
      catch(e){netLeave();ost('⚠ '+esc(e.message||String(e)));$('#mk').disabled=false;$('#jn').disabled=false}}};
  draw_()}

/* --------------------------- EDITOR DE BARALHOS --------------------------- */
const CONT_ORDER=['Atharvash','Gaia','Kurai','Apólia','x'];
const TYPE_ORDER=['omnita','equip','totem','regular','instant','knowledge'];
function fakeCard(id){return{uid:'def-'+id,id,d:DEF[id],equips:[],mods:[],dmg:0}}
function showEditor(){
  loadCustom();const st=$('#start');st.style.display='grid';
  const E={name:'Meu baralho',counts:new Map(),cont:'Todos',type:'Todos',q:''};
  const loadFrom=k=>{E.counts=new Map(DECKS[k].list.map(([i,n])=>[i,n]));E.name=DECKS[k].custom?k:k+' (cópia)'};
  loadFrom('Kurai');
  const pool=()=>Object.values(DEF).filter(d=>d.type!=='token').filter(d=>(E.cont==='Todos'||d.cont===E.cont||(E.cont==='Extra'&&d.cont==='x'))&&(E.type==='Todos'||d.type===E.type)&&(!E.q||d.name.toLowerCase().includes(E.q.toLowerCase())||d.text.toLowerCase().includes(E.q.toLowerCase()))).sort((a,b)=>CONT_ORDER.indexOf(a.cont)-CONT_ORDER.indexOf(b.cont)||TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type)||a.lvl-b.lvl);
  const total=()=>[...E.counts.values()].reduce((s,n)=>s+n,0);
  const draw_=()=>{
    const list=[...E.counts.entries()].filter(([,n])=>n>0).sort((a,b)=>TYPE_ORDER.indexOf(DEF[a[0]].type)-TYPE_ORDER.indexOf(DEF[b[0]].type)||DEF[a[0]].lvl-DEF[b[0]].lvl);
    const byType={};for(const[i,n]of list){const t=DEF[i].type;byType[t]=(byType[t]||0)+n}
    const sel=(arr,val,key)=>`<select data-f="${key}">${arr.map(([v,l])=>`<option value="${v}" ${val===v?'selected':''}>${l}</option>`).join('')}</select>`;
    const t=total();
    st.innerHTML=`<div class="box editor"><h2 class="edh">Editor de baralhos</h2>
     <div class="ed-grid">
      <div class="ed-left">
        <div class="ed-filters">${sel([['Todos','Todos os continentes'],['Atharvash','Atharvash'],['Gaia','Gaia'],['Kurai','Kurai'],['Apólia','Apólia'],['Extra','Extras']],E.cont,'cont')}
        ${sel([['Todos','Todos os tipos'],...TYPE_ORDER.map(x=>[x,TYPE_LABEL[x]])],E.type,'type')}
        <input data-f="q" placeholder="Buscar nome ou texto" value="${esc(E.q)}"></div>
        <p class="muted">Clique numa carta para adicionar (máximo 4 cópias).</p>
        <div class="ed-pool">${pool().map(d=>{const n=E.counts.get(d.id)||0;return`<div class="ed-c ${n>=4?'full':''}" data-add="${d.id}">${cardHTML(fakeCard(d.id),{size:'sm'})}${n?`<span class="ed-n">${n}</span>`:''}</div>`}).join('')}</div>
      </div>
      <div class="ed-right">
        <input data-f="name" value="${esc(E.name)}" class="ed-name">
        <div class="ed-total ${t<60?'bad':''}">${t} cartas ${t<60?`· faltam ${60-t}`:'✓'}</div>
        <div class="muted" style="font-size:12px">${TYPE_ORDER.filter(x=>byType[x]).map(x=>`${TYPE_LABEL[x]}: ${byType[x]}`).join(' · ')}</div>
        <div class="ed-list">${list.map(([i,n])=>`<div class="ed-row" data-uid="def-${i}"><span class="ed-lv">${DEF[i].lvl}</span><span class="ed-nm c-${DEF[i].cont}">${esc(DEF[i].name)}</span><span>×${n}</span><button class="btn sm" data-rem="${i}">−</button><button class="btn sm" data-add="${i}" ${n>=4?'disabled':''}>+</button></div>`).join('')||'<p class="muted">Baralho vazio.</p>'}</div>
        <div class="ed-actions">
          <button class="btn primary" data-a="save">Salvar</button>
          ${sel([['','Carregar baralho…'],...Object.keys(DECKS).map(k=>[k,k+(DECKS[k].custom?' (seu)':'')])],'','load')}
          <button class="btn" data-a="clear">Esvaziar</button>
          <button class="btn danger" data-a="del">Excluir</button>
        </div>
        <details><summary>Compartilhar (código do baralho)</summary>
          <textarea class="ed-code" placeholder="Cole aqui um código para importar"></textarea>
          <button class="btn" data-a="export">Gerar código</button> <button class="btn" data-a="import">Importar código</button></details>
        <p class="muted" id="edmsg"></p>
        <button class="btn" data-a="back">← Voltar</button>
      </div></div></div>`;
    const msg=t=>{const m=$('#edmsg');if(m)m.textContent=t};
    st.querySelectorAll('[data-add]').forEach(el=>el.onclick=e=>{e.stopPropagation();const id=el.dataset.add;const n=E.counts.get(id)||0;if(n<4){E.counts.set(id,n+1);draw_()}});
    st.querySelectorAll('[data-rem]').forEach(el=>el.onclick=()=>{const id=el.dataset.rem;const n=(E.counts.get(id)||0)-1;if(n<=0)E.counts.delete(id);else E.counts.set(id,n);draw_()});
    st.querySelectorAll('select[data-f],input[data-f]').forEach(el=>{const key=el.dataset.f;
      if(key==='load')el.onchange=()=>{if(el.value){loadFrom(el.value);draw_()}};
      else if(key==='q')el.oninput=()=>{E.q=el.value;clearTimeout(el._t);el._t=setTimeout(()=>{draw_();const q=st.querySelector('input[data-f=q]');q.focus();q.setSelectionRange(q.value.length,q.value.length)},250)};
      else if(key==='name')el.oninput=()=>{E.name=el.value};
      else el.onchange=()=>{E[key]=el.value;draw_()}});
    st.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>{const a=el.dataset.a;
      if(a==='back'){showStart();return}
      if(a==='clear'){E.counts.clear();draw_();return}
      if(a==='save'){const n=E.name.trim();if(!n){msg('Dê um nome ao baralho.');return}if(DECKS[n]&&!DECKS[n].custom){msg('Esse nome é de um baralho inicial; escolha outro.');return}
        DECKS[n]={desc:'Baralho personalizado',list:[...E.counts.entries()].filter(([,c])=>c>0),custom:true};const ok=saveCustom();E.name=n;draw_();msg(ok?`"${n}" salvo${total()<60?' (ainda incompleto: precisa de 60 cartas para jogar)':''}.`:'Não foi possível salvar neste navegador.');return}
      if(a==='del'){const n=E.name.trim();if(DECKS[n]&&DECKS[n].custom){delete DECKS[n];saveCustom();msg(`"${n}" excluído.`)}else msg('Só baralhos seus podem ser excluídos.');return}
      if(a==='export'){const code=btoa(unescape(encodeURIComponent(JSON.stringify({n:E.name,l:[...E.counts.entries()]}))));st.querySelector('.ed-code').value=code;msg('Código gerado: copie e mande para quem quiser.');return}
      if(a==='import'){try{const o=JSON.parse(decodeURIComponent(escape(atob(st.querySelector('.ed-code').value.trim()))));E.name=o.n||'Importado';E.counts=new Map(o.l.filter(([i,n])=>DEF[i]&&n>0).map(([i,n])=>[i,Math.min(4,n)]));draw_();msg('Baralho importado. Clique em Salvar para guardar.')}catch(e){msg('Código inválido.')}return}
    })};
  draw_()}

async function startGame(cfg,legacyB){
  if(typeof cfg==='string')cfg={mode:AUTO?'auto':'ai',d1:cfg,d2:legacyB,diff:'normal'};
  INST.clear();UID=1;$('#log').innerHTML='';VIEW=0;FOCUS_DEPTH=0;
  const hot=cfg.mode==='hot',onl=cfg.mode==='online';LOGBUF=[];
  P=[newPlayer(0,onl?cfg.n1:hot?'Jogador 1':AUTO?'IA Sul':'Você',AUTO,cfg.d1),newPlayer(1,onl?cfg.n2:hot?'Jogador 2':'Oponente',!hot&&!onl,cfg.d2)];
  if(onl){P[1].remote=true;if(cfg.label2)P[1].deckName=cfg.label2}
  G={turnNo:0,active:0,phase:'main1',busy:true,over:false,mode:cfg.mode,diff:cfg.diff||'normal'};
  for(const p of P)draw(p,RULES.openingHand);
  render();
  for(const p of P){if(p.isAI)continue;await focus(p);render();let n=RULES.openingHand;
    while(n>1){const r=await asHuman(p,()=>ask(hot||cfg.mode==='online'?`Mão inicial de ${p.name}`:'Sua mão inicial',[...p.hand.map(c=>({card:c,value:null,disabled:true,show:true})),{label:'Manter mão',value:'keep',primary:true},{label:`Trocar (comprar ${n-1})`,value:'mull'}],{text:'Se não gostar, devolva tudo, embaralhe e compre uma carta a menos.'}));if(r==='keep')break;n--;p.deck.push(...p.hand.splice(0));shuffle(p.deck);draw(p,n);render()}}
  for(const p of P)draw(p,RULES.extraAfterMulligan);
  const first=rnd(2);log(`Moeda: ${P[first].name} começa.`,'t');
  await startTurn(P[first]);
}
if(AUTO){$('#start').style.display='none';const ks=Object.keys(DECKS);startGame(ks[rnd(ks.length)],ks[rnd(ks.length)])}else showStart();
// gancho de teste
window.__omni={get G(){return G},get P(){return P},endTurn};
</script>
