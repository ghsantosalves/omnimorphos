<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omnimorphos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15110e;--panel:#211b17;--panel2:#2c241e;--line:#43372e;--text:#f1e8dc;--muted:#a99a8b;--gold:#e0ad48;--red:#d8573f;--ok:#62b77e;--ath:#cf5530;--gaia:#3f9d58;--kurai:#4b93c6;--apo:#c9a227;--tok:#7f7569;--xp:#9b6cd3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.35 "Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(ellipse at 50% 45%,#2a1f17 0%,#15110e 70%) fixed}
button{font:inherit}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1b140c;border-color:var(--gold)}
.btn.danger{background:#5a2219;border-color:var(--red)}
.btn:disabled,.btn.disabled{opacity:.4;cursor:not-allowed}
#game{display:grid;grid-template-columns:1fr 290px;height:100vh;overflow:hidden}
#board{display:flex;flex-direction:column;gap:6px;padding:8px 12px;min-width:0;overflow:auto}
#side{border-left:1px solid var(--line);background:#0f0c0acc;display:flex;flex-direction:column;min-height:0}
#preview{padding:12px;border-bottom:1px solid var(--line);min-height:300px}
#log{flex:1;overflow:auto;padding:8px 12px;font-size:12.5px}
#log div{padding:2px 0;border-bottom:1px solid #ffffff08}
#log .t{color:var(--gold);font-weight:700;margin-top:6px}
#log .atk{color:#ffb09f}#log .xp{color:#cdb0f2}#log .dmg{color:#ff8a75}#log .heal{color:#98e0ae}
.pbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.pbar .nm{font-family:Cinzel,serif;font-weight:800;font-size:15px}
.pbar .nm small{font-family:"Segoe UI",sans-serif;font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.hp{font-weight:800;font-size:18px;color:#ff8c7a}
.lvl{background:#111;border:1.5px solid var(--lc,var(--gold));color:var(--lc,var(--gold));border-radius:14px;padding:1px 9px;font-weight:800}
.lc1{--lc:#b9c0c8}.lc2{--lc:#62b77e}.lc3{--lc:#4b9be0}.lc4{--lc:#a77be0}.lc5{--lc:#e0ad48}.lc6{--lc:#ef8a3c}.lc7{--lc:#e2523a}.lc8{--lc:#ff5fb0}.lc9{--lc:#ffffff}
.hpbar{width:90px;height:9px;background:#0007;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.hpbar{display:flex}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#c0392b,#ff8c7a)}
.hpbar b{display:block;height:100%;background:linear-gradient(90deg,#7fb3e6,#cfe6ff);border-left:1px solid #0008}
.hpbar.wide{width:120px}
.pile.hot{border-color:var(--gold);box-shadow:0 0 10px #e0ad4888;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 2px #e0ad4844}}
.card .tp{position:absolute;bottom:5px;left:4px;border-radius:10px;padding:1px 6px;font-size:9.5px;font-weight:800;border:1.5px solid #0008;color:#fff;white-space:nowrap}
.tp.t-omnita{background:#5b4636}.tp.t-token{background:#555}.tp.t-instant{background:#7b3fc4}.tp.t-regular{background:#2f6fb0}.tp.t-knowledge{background:#1f8a7a}.tp.t-totem{background:#8a5a2b}.tp.t-equip{background:#5d6670}
.tile{display:flex;align-items:center;gap:6px;width:150px;height:40px;background:#000a;border:1.5px solid var(--cc);border-radius:8px;overflow:hidden;font-size:11px;font-weight:700;position:relative}
.tile img{width:46px;height:100%;object-fit:cover;flex:none}
.tile.c-Atharvash{--cc:var(--ath)}.tile.c-Gaia{--cc:var(--gaia)}.tile.c-Kurai{--cc:var(--kurai)}.tile.c-Apólia{--cc:var(--apo)}
.tile.clickable{cursor:pointer;box-shadow:0 0 0 2px #fff6}
.tile .u{position:absolute;right:4px;top:2px;font-size:11px}
.resp-card{display:flex;justify-content:center;margin:6px 0}
.resp-card .big{max-width:230px}
.chk{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px}
.xpbar{width:120px;height:9px;background:#0007;border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:var(--lc,var(--xp))}
.pile{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;cursor:pointer}
.pile:hover{border-color:var(--gold)}
.chip{font-size:11px;background:#0006;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--muted)}
.chip.bad{color:#ffab9b;border-color:#7a3a2e}.chip.good{color:#a6e6b8;border-color:#2f6a42}
.row{display:flex;gap:14px;align-items:center;min-height:196px;padding:8px 10px;border-radius:12px;flex-wrap:wrap}
.row.field{background:#ffffff06;border:1px dashed #ffffff14;min-height:204px}
.row.back{min-height:0;padding:2px 10px}
.row.field{flex-wrap:nowrap;align-items:stretch}
.tot{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-width:92px;border-right:1px dashed #ffffff1c;padding-right:10px}
.tot .ttl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.units{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;align-content:center;flex:1}
.unit{display:flex;flex-direction:column;align-items:center;gap:3px}
.unit .card+.eq{margin-top:9px}
.eq{font-size:10.5px;background:#000b;border:1px solid var(--line);border-radius:6px;padding:1px 6px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eq b{color:#b9f0c9}
.hint{flex-basis:100%;text-align:center;font-size:12.5px;color:#ecd9a2;min-height:16px}
.card .badges .rdy{background:#7a2416;border-radius:6px;padding:0 3px;font-size:12px}
.row.back:empty{display:none}
.hand{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:194px;padding:4px 0 8px}
#opphand,#mid{display:none}
.hand.opp{min-height:0;padding:0;gap:4px}
.mid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:2px 0}
.phase{display:flex;gap:4px}
.phase span{font-size:12px;padding:3px 10px;border-radius:12px;background:#0005;color:var(--muted);border:1px solid var(--line)}
.phase span.on{background:var(--gold);color:#1b140c;border-color:var(--gold);font-weight:700}
.turnlbl{font-family:Cinzel,serif;font-weight:800}
.card{position:relative;width:124px;height:182px;border-radius:9px;background:#1d1713;border:2px solid var(--cc);padding:0;font-size:10px;user-select:none;flex:none;box-shadow:0 3px 8px #000a;transition:transform .12s,box-shadow .12s}
.card.c-Apólia{--cc:var(--apo)}.big.c-Apólia{--cc:var(--apo)}.deck.c-Apólia{--cc:var(--apo)}.card.c-Atharvash{--cc:var(--ath)}.card.c-Gaia{--cc:var(--gaia)}.card.c-Kurai{--cc:var(--kurai)}.card.c-x{--cc:var(--tok)}
.card .nm{position:absolute;left:0;right:0;top:0;z-index:1;font-weight:800;font-size:11.5px;line-height:1.15;max-height:4.2em;overflow:hidden;padding:7px 8px 16px 31px;border-radius:7px 7px 0 0;background:linear-gradient(#000e 0%,#000a 55%,#0000);text-shadow:0 1px 2px #000}
.card .lv{position:absolute;top:4px;left:4px;background:#111;border:1.5px solid var(--lc,var(--gold));color:var(--lc,var(--gold));border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-weight:800;font-size:11px}
.card .xpb{position:absolute;top:4px;right:4px;background:#2b2140;border:1.5px solid var(--xp);border-radius:10px;padding:0 5px;font-size:10px;font-weight:700}
.card .art{position:absolute;inset:0;z-index:0;display:grid;place-items:center;font-size:42px;background:linear-gradient(165deg,var(--cc) 0%,#1d1713 75%);border-radius:7px;overflow:hidden}
.card .txtbox{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:18px 7px 29px;border-radius:0 0 7px 7px;background:linear-gradient(#0000,#000b 35%,#000e)}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.art img.hd{object-position:50% 0%}
.card .badges,.card .eqs{z-index:2}
.card .badges span{text-shadow:0 1px 3px #000}
.card .cat{font-size:10.5px;color:#eadfce;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .kw{display:none}
.card .kics{position:absolute;left:4px;top:36px;z-index:2;display:flex;flex-direction:column;gap:3px}
.kic{display:grid;place-items:center;width:23px;height:23px;border-radius:50%;background:#120d0acc;border:1.5px solid var(--cc);font-size:13px;line-height:1;box-shadow:0 1px 4px #000c;cursor:help}
.card.sm .kic{width:19px;height:19px;font-size:11px}
.kic.k-voar{border-color:#e8eef5;box-shadow:0 0 6px #e8eef566,0 1px 4px #000c}.kic.k-alcance{border-color:#9fd36b;box-shadow:0 0 6px #9fd36b66,0 1px 4px #000c}.kic.k-agil{border-color:#ffd34d;box-shadow:0 0 6px #ffd34d66,0 1px 4px #000c}.kic.k-golpe{border-color:#ff9d5c;box-shadow:0 0 6px #ff9d5c66,0 1px 4px #000c}.kic.k-atropelar{border-color:#8fbf5a;box-shadow:0 0 6px #8fbf5a66,0 1px 4px #000c}.kic.k-consumir{border-color:#b07ce5;box-shadow:0 0 6px #b07ce566,0 1px 4px #000c}.kic.k-montaria{border-color:#c9a27a;box-shadow:0 0 6px #c9a27a66,0 1px 4px #000c}.kic.k-treinamento{border-color:#e0ad48;box-shadow:0 0 6px #e0ad4866,0 1px 4px #000c}.kic.k-obstinacao{border-color:#b9a68f;box-shadow:0 0 6px #b9a68f66,0 1px 4px #000c}.kic.k-imbloqueavel{border-color:#b8c4ff;box-shadow:0 0 6px #b8c4ff66,0 1px 4px #000c}.kic.k-queimadura{border-color:#ff5a36;box-shadow:0 0 6px #ff5a3666,0 1px 4px #000c}.kic.k-rescalor{border-color:#7fd8ff;box-shadow:0 0 6px #7fd8ff66,0 1px 4px #000c}.kic.k-runica{border-color:#6fc3a0;box-shadow:0 0 6px #6fc3a066,0 1px 4px #000c}
.kwrows{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
.kwr{display:grid;grid-template-columns:24px 1fr;gap:7px;align-items:start;font-size:12px;line-height:1.3;text-shadow:0 1px 2px #000}
.kwr .kic{width:24px;height:24px}
.kwr b{color:var(--gold)}
.kwr span.d{color:#e6dccd}
.big .rules{font-size:12.5px;line-height:1.4;padding-top:6px;border-top:1px solid #ffffff22;text-shadow:0 1px 2px #000;white-space:pre-line}
.big .flav{font-size:11.5px;font-style:italic;color:var(--muted);margin-top:6px}
.big .stat{font-size:11.5px;color:#cfe6ff;margin-top:6px;white-space:pre-line}
.card .st{position:absolute;bottom:4px;right:4px;background:#111;border:1.5px solid var(--text);border-radius:10px;padding:1px 7px;font-weight:800;font-size:12.5px}
.card .st.hurt{border-color:var(--red);color:#ffb3a3}
.card .st.buff{border-color:var(--ok);color:#b9f0c9}
.card .badges{position:absolute;top:42px;left:31px;right:3px;z-index:2;display:flex;gap:2px;flex-wrap:wrap;font-size:13px}
.card .lv,.card .xpb,.card .st,.card .tp{z-index:3}
.card .eqs{position:absolute;bottom:2px;left:2px;display:flex;flex-direction:column;gap:1px}
.card .eqs span{font-size:8px;background:#000b;border-radius:4px;padding:0 3px;max-width:70px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card.sm{width:100px;height:146px}.card.sm .art{font-size:30px}.card.sm .nm{font-size:10px;padding-left:28px}
.card.playable{cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 0 16px #e0ad4888}
.card.playable:hover{transform:translateY(-10px)}
.card.canatk{cursor:pointer;box-shadow:0 0 0 2px var(--red),0 0 16px #d8573f99}
.card.canatk:hover{transform:translateY(-6px)}
.card.clickable{cursor:pointer}
.bigview .bigwrap{width:min(320px,88vw)}
.bigview .big{max-width:none}
.bigview .btxt{max-height:70%}
.card,[data-uid]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.inp{background:#0006;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font-size:15px;width:min(260px,100%)}
.online-box{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}.online-box>div{min-width:220px}
.ost{min-height:24px}.ost .code{font-family:Cinzel,serif;font-size:30px;letter-spacing:5px;color:var(--gold);vertical-align:middle;margin:0 6px}
.dice3d{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:#0008;cursor:pointer}
.dice3d .dbox{text-align:center}
.dice3d .dl{color:var(--gold);font-weight:800;font-size:15px;margin-bottom:4px;text-shadow:0 2px 6px #000}
.dice3d .dr{font-family:Cinzel,serif;font-size:42px;font-weight:800;color:#fff;min-height:52px;opacity:0;transform:scale(.6);transition:.25s}
.dice3d.done .dr{opacity:1;transform:none}
.dice3d .dh{font-size:11px;color:var(--muted)}
.opt3d-l{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}.opt3d-l input{accent-color:var(--gold);width:16px;height:16px}
.hand,.row{perspective:1000px}
.card{transition:transform .12s,box-shadow .12s,rotate .18s ease-out}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;opacity:0;transition:opacity .2s;background:radial-gradient(circle at var(--gx,50%) var(--gy,50%),#ffffff55,#ffffff10 35%,transparent 60%);mix-blend-mode:overlay}
.card.tilt::before{opacity:1}
.card.enter3d{animation:enter3d .5s cubic-bezier(.2,.8,.3,1.2)}
@keyframes enter3d{from{transform:rotateY(100deg) translateY(-24px) scale(.85);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.enter3d{animation:none}.card{transition:none}}
.card.abil,.tile.abil{box-shadow:0 0 0 2px #8fd3ff,0 0 16px #6cc4ff99;animation:abilglow 1.8s ease-in-out infinite}
.card.abil::after{content:'✨ Habilidade';position:absolute;top:-9px;left:50%;transform:translateX(-50%);z-index:3;background:#16324a;color:#bfe6ff;border:1px solid #6cc4ff;border-radius:9px;font-size:10px;font-weight:800;padding:0 7px;white-space:nowrap}
@keyframes abilglow{50%{box-shadow:0 0 0 2px #8fd3ff,0 0 26px #6cc4ffcc}}
.chip.susp{color:#f3d7a0;border-color:#a8814d;cursor:help}
.card.clickable:hover{box-shadow:0 0 0 2px #fff6}
.card.latent .art img{filter:grayscale(.6) brightness(.8)}
.card.back{background:url(artes/verso.jpg) center/cover,repeating-linear-gradient(45deg,#3b2a1d,#3b2a1d 6px,#2b1f16 6px,#2b1f16 12px);border-color:#7b5a3a;width:46px;height:64px;padding:0}
.card.flash{animation:flash .5s}
@keyframes flash{0%{transform:scale(1.12);box-shadow:0 0 22px var(--red)}100%{}}
.big{width:100%;max-width:260px;margin:0 auto;border-radius:12px;border:2px solid var(--cc);background:#1d1713;padding:0;overflow:hidden}
.bigcard{position:relative;aspect-ratio:2/3;max-width:100%}
.bnm{position:absolute;left:0;right:0;top:0;z-index:1;padding:9px 11px 22px;background:linear-gradient(#000e,#000a 60%,#0000);text-shadow:0 1px 3px #000}
.btxt{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:26px 11px 9px;background:linear-gradient(#0000,#000c 18%,#000e);max-height:62%;overflow:auto}
.big.c-Atharvash{--cc:var(--ath)}.big.c-Gaia{--cc:var(--gaia)}.big.c-Kurai{--cc:var(--kurai)}.big.c-x{--cc:var(--tok)}
.big h4{margin:0 0 2px;font-family:Cinzel,serif;font-size:16px}
.big .meta{font-size:12px;color:#e6d9c8}
.big .art{position:absolute;inset:0;font-size:54px;display:grid;place-items:center;background:linear-gradient(170deg,var(--cc) 0%,#1d1713 70%);overflow:hidden}
.big .txt{font-size:12.5px;white-space:pre-line;text-shadow:0 1px 2px #000}
.big .foot{display:flex;justify-content:space-between;margin-top:6px;font-weight:700}
.muted{color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:min(900px,96vw);max-height:90vh;overflow:auto;box-shadow:0 10px 40px #000}
.modal h3{margin:0 0 6px;font-family:Cinzel,serif}
.modal p{margin:4px 0 10px;color:#ddd0c0}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:10px 0}
.opt-card{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:8px 6px 4px;border-radius:10px}
.opt-card:hover{background:#ffffff10}
.opt-card.sel{background:#e0ad4833;outline:2px solid var(--gold)}
.opt-card.static{cursor:default}
.opt-card.disabled{opacity:.35;cursor:not-allowed}
.optlbl{font-size:11.5px;max-width:110px;text-align:center}
#start{position:fixed;inset:0;display:grid;place-items:center;z-index:40;background:radial-gradient(ellipse at center,#2f2117,#0e0a08);padding:16px;overflow:auto}
#start .box{max-width:820px;width:100%;text-align:center}
#start h1{font-family:Cinzel,serif;font-size:clamp(34px,7vw,64px);margin:0;letter-spacing:3px;color:var(--gold);text-shadow:0 3px 20px #000}
#start .sub{color:var(--muted);margin-bottom:22px}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.deck{border:2px solid var(--cc);border-radius:12px;padding:12px;background:linear-gradient(170deg,color-mix(in srgb,var(--cc) 45%,transparent),#1a1410);cursor:pointer;text-align:left}
.deck.sel{box-shadow:0 0 0 3px var(--gold)}
.deck h3{margin:0;font-family:Cinzel,serif}
.deck p{margin:6px 0 0;font-size:12.5px;color:#e2d6c6}
.deck.c-Atharvash{--cc:var(--ath)}.deck.c-Gaia{--cc:var(--gaia)}.deck.c-Kurai{--cc:var(--kurai)}
.lbl{font-weight:700;margin-top:14px;text-align:left}
.rules{text-align:left;font-size:13px;background:#0007;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px}
.rules li{margin:3px 0}
.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px 0}
#start .box.editor{max-width:1200px;text-align:left}
.edh{font-family:Cinzel,serif;color:var(--gold);margin:0 0 10px}
.ed-grid{display:grid;grid-template-columns:1fr 340px;gap:16px}
.ed-filters{display:flex;gap:8px;flex-wrap:wrap}
.ed-filters select,.ed-filters input,.ed-right select,.ed-name,.ed-code{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit}
.ed-pool{display:flex;flex-wrap:wrap;gap:12px;max-height:70vh;overflow:auto;padding:10px 6px}
.ed-c{position:relative;cursor:pointer}.ed-c:hover .card{transform:translateY(-4px)}.ed-c.full{opacity:.45}
.ed-n{position:absolute;bottom:-6px;left:-6px;background:var(--gold);color:#1b140c;border-radius:10px;padding:0 7px;font-weight:800;z-index:3}
.ed-right{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;max-height:82vh}
.ed-name{width:100%;font-weight:700;font-size:15px}
.ed-total{font-weight:800;font-size:18px;color:var(--ok)}.ed-total.bad{color:#ff9b88}
.ed-list{flex:1;overflow:auto;min-height:120px;border-top:1px solid var(--line);padding-top:6px}
.ed-row{display:grid;grid-template-columns:22px 1fr auto auto auto;gap:6px;align-items:center;padding:2px 0;font-size:13px}
.ed-lv{color:var(--gold);font-weight:800}.ed-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-nm.c-Atharvash{color:#ff9c7c}.ed-nm.c-Gaia{color:#8fe0a2}.ed-nm.c-Kurai{color:#9fcbf0}.ed-nm.c-Apólia{color:#f1d27a}
.btn.sm{padding:1px 8px}

<body>
<div id="game">
  <div id="board">
    <div class="pbar" id="oppbar"></div>
    <div class="hand opp" id="opphand"></div>
    <div class="row back" id="oppback"></div>
    <div class="row field" id="oppfield"></div>
    <div class="mid" id="mid"></div>
    <div class="row field" id="myfield"></div>
    <div class="row back" id="myback"></div>
    <div class="pbar" id="mybar"></div>
    <div class="hand" id="myhand"></div>
  </div>
  <aside id="side"><div id="preview"><p class="muted">Passe o mouse sobre uma carta para ver os detalhes.</p></div><div id="log"></div></aside>
</div>
<div id="start"></div>

<script>
/* =====================================================================
   REGRAS AJUSTÁVEIS  (mude aqui para testar variações)
   ===================================================================== */
const RULES={
  startHP:20,
  protTurns:2,         // cada Proteção some depois de 2 turnos do dono
  openingHand:6,          // compra inicial
  extraAfterMulligan:1,   // carta extra depois de aceitar a mão
  // faixas de nível: [XP mínimo, nível]
  levels:[[0,1],[6,2],[11,3],[16,4],[26,5],[36,6],[51,7],[71,8]],
  damageResetsEndOfTurn:true, // dano em omnitas some no fim de cada turno
  firstPlayerDraws:false,     // o primeiro jogador não compra no 1º turno
  xpMode:'cartas',            // 'cartas' = XP impresso | 'nivel' = XP igual ao nível da carta (Conhecimento mantém o seu)
};

/* ============================ utilidades ============================ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const d6=()=>1+rnd(6), d20=()=>1+rnd(20), coin=()=>Math.random()<.5;
/* ---------------- dados e moeda em 3D (three.js, carregado só quando precisa) ---------------- */
let THREE_P=null;
function loadThree(){if(window.THREE)return Promise.resolve();if(!THREE_P)THREE_P=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';sc.onload=ok;sc.onerror=()=>{THREE_P=null;no()};document.head.appendChild(sc)});return THREE_P}
async function roll(sides,label){if(G)G.cancellable=false;const r=1+rnd(sides);await show3D(sides===6?'d6':'d20',r,label);return r}
async function flip(label){if(G)G.cancellable=false;const w=coin();await show3D('coin',w?1:0,label);return w}
function faceTex(draw){const cv=document.createElement('canvas');cv.width=cv.height=256;const g=cv.getContext('2d');draw(g);const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t}
function pipFace(n){return faceTex(g=>{const gr=g.createLinearGradient(0,0,256,256);gr.addColorStop(0,'#fbf3e2');gr.addColorStop(1,'#e2d2b2');g.fillStyle=gr;g.fillRect(0,0,256,256);g.strokeStyle='#b8893a';g.lineWidth=14;g.strokeRect(7,7,242,242);
  const P={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[3,1],[1,3],[3,3]],5:[[1,1],[3,1],[2,2],[1,3],[3,3]],6:[[1,1],[3,1],[1,2],[3,2],[1,3],[3,3]]}[n];
  for(const[x,y]of P){g.beginPath();g.arc(x*64,y*64,n===1?30:22,0,7);g.fillStyle=n===1?'#b3261e':'#2a1d14';g.fill()}})}
function coinFace(win){return faceTex(g=>{const gr=g.createRadialGradient(110,100,10,128,128,130);gr.addColorStop(0,'#ffe9a6');gr.addColorStop(1,'#b8862e');g.fillStyle=gr;g.fillRect(0,0,256,256);g.strokeStyle='#7a5518';g.lineWidth=10;g.beginPath();g.arc(128,128,112,0,7);g.stroke();
  g.fillStyle='#5a3c0e';g.font='bold 120px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(win?'☀':'☾',128,136)})}
async function show3D(kind,r,label){
  if(AUTO||SETTINGS.no3d||typeof document==='undefined')return;
  try{await loadThree()}catch(e){return}
  const T=window.THREE;if(!T)return;
  const ov=document.createElement('div');ov.className='dice3d';
  const sz=Math.min(260,Math.round(innerWidth*0.6));
  ov.innerHTML=`<div class="dbox"><div class="dl">${esc(label||'')}</div><canvas width="${sz*2}" height="${sz*2}" style="width:${sz}px;height:${sz}px"></canvas><div class="dr"></div><div class="dh">toque para pular</div></div>`;
  document.body.appendChild(ov);const cv=ov.querySelector('canvas');
  let rd;try{rd=new T.WebGLRenderer({canvas:cv,alpha:true,antialias:true})}catch(e){ov.remove();return}
  const sc=new T.Scene(),cam=new T.PerspectiveCamera(35,1,0.1,50);cam.position.set(0,0,7);
  sc.add(new T.AmbientLight(0xffffff,0.55));const dl=new T.DirectionalLight(0xffffff,0.9);dl.position.set(3,4,6);sc.add(dl);
  let m,target;
  if(kind==='d6'){const vals=[3,4,1,6,2,5];m=new T.Mesh(new T.BoxGeometry(1.7,1.7,1.7),vals.map(v=>new T.MeshStandardMaterial({map:pipFace(v),roughness:.45})));
    target={1:[Math.PI/2,0,0],6:[-Math.PI/2,0,0],2:[0,0,0],5:[0,Math.PI,0],3:[0,-Math.PI/2,0],4:[0,Math.PI/2,0]}[r]}
  else if(kind==='d20'){m=new T.Mesh(new T.IcosahedronGeometry(1.3,0),new T.MeshStandardMaterial({color:0x2f6fa8,roughness:.35,metalness:.2,flatShading:true}));
    m.add(new T.LineSegments(new T.EdgesGeometry(m.geometry),new T.LineBasicMaterial({color:0xcfe8ff})));target=[0.4,0.6,0]}
  else{const side=new T.MeshStandardMaterial({color:0x9a6f22,metalness:.6,roughness:.35});
    m=new T.Mesh(new T.CylinderGeometry(1.25,1.25,0.16,48),[side,new T.MeshStandardMaterial({map:coinFace(true),metalness:.5,roughness:.4}),new T.MeshStandardMaterial({map:coinFace(false),metalness:.5,roughness:.4})]);
    target=[r?Math.PI/2:-Math.PI/2,0,0]}
  if(kind==='d6')target=[target[0]+0.32,target[1]-0.42,target[2]];
  sc.add(m);
  const turns=kind==='coin'?[8,0,0]:[2+rnd(2),2+rnd(2),1+rnd(2)];
  const D=1300;let skip=false;ov.onclick=()=>{skip=true};
  await new Promise(done=>{const t0=performance.now();
    const step=now=>{let t=Math.min(1,(now-t0)/D);if(skip)t=1;const e=1-Math.pow(1-t,3);
      m.rotation.set(target[0]+turns[0]*2*Math.PI*(1-e),target[1]+turns[1]*2*Math.PI*(1-e),target[2]+turns[2]*2*Math.PI*(1-e));
      m.position.y=Math.abs(Math.sin(t*Math.PI*3))*(1-t)*1.4;rd.render(sc,cam);
      if(t<1)requestAnimationFrame(step);else done()};requestAnimationFrame(step)});
  ov.querySelector('.dr').textContent=kind==='coin'?(r?'Ganhou!':'Perdeu!'):String(r);ov.classList.add('done');
  await new Promise(ok=>{const tm=setTimeout(ok,skip?350:850);ov.onclick=()=>{clearTimeout(tm);ok()}});
  ov.remove();try{rd.dispose();rd.forceContextLoss()}catch(e){}}

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let UID=1; const INST=new Map();
const AUTO=/auto=1/.test(location.search);
const SPEED=AUTO?60:1;

/* ============================== cartas ============================== */
const DEF={};
function O(id,name,cont,cat,xp,lvl,atk,def,text,o={}){DEF[id]={id,name,cont,type:'omnita',cat,xp,lvl,atk,def,text,kw:[],...o}}
function S(id,name,cont,type,xp,lvl,text,o={}){DEF[id]={id,name,cont,type,xp,lvl,text,kw:[],...o}}
function T(id,name,cont,cat,atk,def,o={}){DEF[id]={id,name,cont,type:'token',cat,xp:0,lvl:0,atk,def,text:'Ficha.',kw:[],...o}}
const TYPE_LABEL={omnita:'Omnita',token:'Ficha',equip:'Equipamento',totem:'Totem',knowledge:'Conhecimento',instant:'Execução Instantânea',regular:'Execução Regular'};
const KW_LABEL={obstinacao:'Obstinação',agil:'Ataque Rápido',atropelar:'Atropelar',voar:'Voar',alcance:'Alcance',golpe:'Golpe Duplo',consumir:'Consumir',montaria:'Montaria',treinamento:'Suspender',imbloqueavel:'Imbloqueável',queimadura:'Queimadura',rescalor:'Resistência ao Calor',runica:'Proteção Rúnica'};
const ANIMAL=['Ave','Mamífero','Réptil','Felino','Anfíbio','Sapo','Peixe','Elefante','Cobra','Aranha','Molusco','Urso','Pangolim','Inseto','Fera'];
const isAnimal=d=>(d.type==='omnita'||d.type==='token')&&ANIMAL.some(a=>d.cat.includes(a));
const isHumanoid=c=>/Humano|Humanoide/.test(c.d.cat);

/* ---- helpers de efeito usados nas definições ---- */
const dmgSpell=n=>({dmg:n,ai:p=>bestTargetScore(p,{dmg:n,instant:true})});
const knowledge=(extra={})=>extra;

/* ---------------------------- ATHARVASH ---------------------------- */
O('vorath','Vorath, o Conquistador Kaldraniano','Atharvash','Humano Guerreiro',3,3,3,4,'Recebe +1/+1 para cada omnita Kaldraniano no seu cemitério.',{flavor:'O que importa é a vitória... e ninguém irá me impedir.',stat:(c,p)=>{const n=p.grave.filter(x=>x.d.type==='omnita'&&/Kaldran/.test(x.d.name)).length;return[n,n]}});

O('mestreChamas','Mestre Kaldraniano das Chamas','Atharvash','Humano Feiticeiro',3,3,3,3,'Toda vez que uma Execução Instantânea com efeito queimar é ativada, esta carta ganha +1/+0 até o fim do turno.');
O('dragaoPedra','Dragão de Pedra','Atharvash','Dragão',6,5,6,5,'Tremor: quando esta carta entra, o oponente descarta 2 cartas.',{flavor:'Um dragão que habita as montanhas de Atharvash.',enter:async(c,p)=>{await discardChoose(opp(p),2,'Tremor! Descarte 2 cartas')}});
O('espiritoFogo','Espírito Elemental de Fogo','Atharvash','Espírito Elemental',6,6,2,2,'Se esta carta atacar o oponente diretamente, jogue um d6: este é o número de ataques que ele recebe.');
O('arqueiroK','Arqueiro Kaldraniano','Atharvash','Humano Arqueiro',1,1,2,1,'',{flavor:'Os jovens Kaldranianos podem surpreender com os equipamentos corretos.'});
O('aranthor','Lorde Aranthor, o Exilado','Atharvash','Humano Lorde Guerreiro',9,7,6,7,'Suspender 3: pode ser baixado suspenso por 3 turnos (revelado ao oponente); ao entrar, recebe +2/+3. Cada omnita destruído por Aranthor vira uma ficha Zumbi 1/1 sua.',{kw:['treinamento'],susp:{t:3,txt:'+2/+3 ao entrar',bonus:async c=>{c.mods.push({a:2,d:3});log(`${c.d.name} recebe +2/+3!`)}}});
O('urso','Urso Marrom Gigante','Atharvash','Mamífero Gigante',8,5,5,5,'',{flavor:'Este urso imponente percorre as cordilheiras de Atharvash.'});
O('iniciado','Iniciado Kaldraniano','Atharvash','Humano Mago',3,2,1,1,'Uma vez por turno: escolha um alvo para receber 2 de dano.',{act:{label:'Causar 2 de dano',run:async(c,p)=>{const t=await pickTarget(p,{title:'Iniciado Kaldraniano: 2 de dano',dmg:2});if(t)await hit(t,2,'Iniciado')},ai:p=>bestTargetScore(p,{dmg:2})}});
O('drakara','Cavaleira Drakara','Atharvash','Humano Cavaleiro Réptil',5,3,3,4,'Quando Drakara entrar, procure no baralho outro omnita Réptil e adicione à mão. Embaralhe.',{enter:async(c,p)=>{await search(p,x=>x.d.type==='omnita'&&x.d.cat.includes('Réptil'),'Drakara: escolha um omnita Réptil')}});
O('bruxaPurpura','Bruxa Púrpura','Atharvash','Humano Bruxo',3,1,2,1,'Ao entrar, jogue uma moeda: se ganhar, o oponente queima 2 por 3 turnos. Se perder, você queima 2 por 3 turnos.',{enter:async(c,p)=>{const w=await flip('Bruxa Púrpura');const t=w?opp(p):p;log(`Moeda: ${w?'ganhou':'perdeu'}! ${t.name} queimará 2 por 3 turnos.`,'dmg');t.dots.push({n:2,t:3,src:'Bruxa Púrpura'})}});
O('combatente','Combatente Kaldraniano','Atharvash','Humano Guerreiro',2,1,2,2,'Ataque Rápido: pode atacar no turno em que entra. Suspender 2: pode ser baixado suspenso por 2 turnos (revelado ao oponente); ao entrar, receba 2 de experiência.',{kw:['treinamento','agil'],susp:{t:2,txt:'+2 XP ao entrar',bonus:async(c,p)=>gainXP(p,2,'Suspender')}});
O('salamandra','Salamandra Vulcânica Filhote','Atharvash','Réptil',2,2,2,2,'Montaria: equipe a um omnita humanoide/humano para adicionar seu ataque e defesa.',{kw:['montaria'],flavor:'Uma pequena salamandra comum das regiões vulcânicas.'});
O('slime','Slime Explosivo','Atharvash','Slime',1,1,1,1,'Quando esta carta é derrotada em combate, o oponente recebe 1 de dano.',{death:async(c,p,info)=>{if(info.combat)damagePlayer(opp(p),1,null,'Slime Explosivo')}});

O('fenix','Fênix de Atharvash','Atharvash','Fera Mística Superior',10,8,'?','?','Voar. Sempre que for enviada do campo ao cemitério, retorna ao campo no início do seu próximo turno. Ataque e defesa = número de Execuções Instantâneas no seu cemitério.',{kw:['voar']});

let P=[], G=null, VIEW=0;
const HOT=()=>!!(G&&G.mode==='hot');
const ONLINE=()=>!!(G&&G.mode==='online');const SECRET=()=>HOT()||ONLINE();
function mk(id,owner){const c={uid:UID++,id,d:DEF[id],owner,ctrl:owner,dmg:0,mods:[],latency:true,atkUsed:0,equips:[],frozen:0,suspended:0,prison:null,curled:false,noAbil:false,usedTurn:-1,temp:false};INST.set(c.uid,c);return c}
function newPlayer(id,name,isAI,deck){const p={id,name,isAI,deckName:deck,isPlayer:true,deck:[],hand:[],field:[],totems:[],grave:[],void:[],hp:RULES.startHP,xp:0,sumUsed:0,knowUsed:false,lvlBonus:0,dots:[],hots:[],delayed:[],noSummon:0,fenix:[],decked:false,prot:0};for(const[i,n]of DECKS[deck].list)for(let k=0;k<n;k++)p.deck.push(mk(i,id));shuffle(p.deck);return p}
const opp=p=>P[1-p.id];
const me=()=>P[0];
const allField=()=>[...P[0].field,...P[1].field];
const onField=c=>!!c&&P.some(p=>p.field.includes(c));
const removeFrom=(arr,c)=>{const i=arr.indexOf(c);if(i>=0){arr.splice(i,1);return true}return false};
function cardXP(d){if(typeof d.xp!=='number')return d.xp;if(RULES.xpMode==='nivel'&&d.type!=='knowledge'&&d.type!=='token')return Math.max(1,d.lvl);return d.xp}
function baseLevel(xp){let l=1;for(const[t,v]of RULES.levels)if(xp>=t)l=v;return l}
const level=p=>baseLevel(p.xp)+p.lvlBonus;
function nextLevelXP(xp){for(const[t]of RULES.levels)if(xp<t)return t;return null}
function curLevelXP(xp){let b=0;for(const[t]of RULES.levels)if(xp>=t)b=t;return b}

function kws(c){if(c.noAbil)return new Set();const s=new Set(c.d.kw);for(const e of c.equips){(e.d.eqKw||[]).forEach(k=>s.add(k));(e.d.mountKw||[]).forEach(k=>s.add(k))}if(c.shieldBy&&allField().some(x=>x.uid===c.shieldBy))s.add('runica');return s}
const hasKw=(c,k)=>kws(c).has(k);
function statBonus(c){const p=P[c.ctrl];let a=0,d=0;for(const m of c.mods){a+=m.a;d+=m.d}for(const e of c.equips){if(e.d.type==='omnita'){a+=atk(e,true);d+=def(e,true)}else{a+=e.d.eqAtk||0;d+=e.d.eqDef||0}}if(!c.noAbil&&c.d.stat&&p){const[x,y]=c.d.stat(c,p);a+=x;d+=y}if(!c.noAbil&&c.id==='mestreChamas')a+=c.flame||0;return[a,d]}
function baseAtk(c){if(c.copy)return c.copy.a;if(c.id==='fenix')return P[c.ctrl].grave.filter(x=>x.d.type==='instant').length;return c.d.atk}
function baseDef(c){if(c.copy)return c.copy.d;if(c.id==='fenix')return P[c.ctrl].grave.filter(x=>x.d.type==='instant').length;return c.d.def}
function atk(c,raw){if(c.curled)return 0;return Math.max(0,baseAtk(c)+(raw?0:statBonus(c)[0]))}
function def(c,raw){if(c.curled)return 4;return baseDef(c)+(raw?0:statBonus(c)[1])}
const val=c=>(typeof c.d.atk==='number'?(onField(c)?atk(c)+def(c):c.d.atk+c.d.def):8)+(c.d.lvl||0)*1.5;
const sumVal=a=>a.reduce((s,c)=>s+val(c),0);
const isPrisoned=c=>c.prison&&allField().some(x=>x.uid===c.prison);

let LOGBUF=[];
function log(msg,cls=''){LOGBUF.push([msg,cls]);if(LOGBUF.length>200)LOGBUF.splice(0,LOGBUF.length-200);const el=document.createElement('div');if(cls)el.className=cls;el.textContent=msg;const L=$('#log');L.appendChild(el);L.scrollTop=L.scrollHeight}
function floatTxt(target,txt,cls=''){let el=null;if(target&&target.isPlayer)el=$(target.id===VIEW?'#mybar .hp':'#oppbar .hp');else if(target)el=document.querySelector(`[data-uid="${target.uid}"]`);if(!el)return;const r=el.getBoundingClientRect();const f=document.createElement('div');f.className='float '+cls;f.textContent=txt;f.style.left=(r.left+r.width/2-10)+'px';f.style.top=(r.top)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}

/* ============================ AÇÕES BÁSICAS ========================= */
function gainXP(p,n,src){if(!n)return;const L0=baseLevel(p.xp);p.xp+=n;log(`${p.name} recebe ${n} XP${src?' ('+src+')':''}.`,'xp');floatTxt(p,`+${n} XP`,'xp');const L1=baseLevel(p.xp);if(L1>L0)log(`★ ${p.name} sobe para o nível ${L1}!`,'xp')}
function heal(p,n,src){if(p.scorch&&G.turnNo<=p.scorch){log(`🔥 ${p.name} está queimado e não recupera vida${src?' ('+src+')':''}.`);return}p.hp+=n;log(`${p.name} recupera ${n} de vida${src?' ('+src+')':''}.`,'heal');floatTxt(p,`+${n}`,'heal')}
// Proteção em lotes: cada ganho dura RULES.protTurns turnos do dono; o dano gasta primeiro o lote mais antigo
function syncProt(p){p.protQ=p.protQ||[];let sum=p.protQ.reduce((a,q)=>a+q.n,0);
  while(sum>p.prot&&p.protQ.length){const q=p.protQ[0];const k=Math.min(q.n,sum-p.prot);q.n-=k;sum-=k;if(!q.n)p.protQ.shift()}
  if(sum<p.prot)p.protQ.push({n:p.prot-sum,t:RULES.protTurns})}
function addProt(p,n){if(n<=0)return;syncProt(p);p.protQ.push({n,t:RULES.protTurns});p.prot+=n}
function expireProt(p){syncProt(p);let gone=0;for(const q of p.protQ){q.t--;if(q.t<=0)gone+=q.n}
  p.protQ=p.protQ.filter(q=>q.t>0);p.prot=p.protQ.reduce((a,q)=>a+q.n,0);if(gone)log(`🛡 ${gone} de Proteção de ${p.name} se desfaz.`)}
function damagePlayer(p,n,srcCard,label,ignoreProt){if(n<=0||G.over)return;if(p.prot&&!ignoreProt&&G.fire){log('🔥 O fogo atravessa a Proteção.')}if(p.prot&&!ignoreProt&&!G.fire){const a=Math.min(p.prot,n);p.prot-=a;n-=a;log(`🛡 A Proteção de ${p.name} absorve ${a}.`);if(!n){if(srcCard)atharvashHeart(srcCard);return}}p.hp-=n;if(srcCard&&srcCard.d&&hasKw(srcCard,'queimadura')){p.scorch=G.turnNo+(G.active===p.id?2:1)}log(`${p.name} recebe ${n} de dano${label?' ('+label+')':srcCard?' ('+srcCard.d.name+')':''}.`,'dmg');floatTxt(p,`-${n}`);if(srcCard)atharvashHeart(srcCard);checkOver()}
function atharvashHeart(c){if(c.d.cont!=='Atharvash'||!(c.d.type==='omnita'||c.d.type==='token'))return;const p=P[c.ctrl];const n=p.totems.filter(t=>t.id==='coracaoAth').length;if(n)gainXP(p,n,'Coração Atharvashiano')}
function draw(p,n){for(let i=0;i<n;i++){if(!p.deck.length){p.decked=true;log(`${p.name} não tem mais cartas no baralho!`,'dmg');checkOver();return}p.hand.push(p.deck.pop());const h=p.totems.filter(t=>t.id==='crescimento').length;if(h)heal(p,h,'Crescimento Excessivo')}}
function toGrave(c){if(c.d.type==='token'){INST.delete(c.uid);return}const o=P[c.owner];if(o.totems.some(t=>t.id==='desvio')&&c.id!=='desvio'){toVoid(c);return}resetCard(c);o.grave.push(c)}
function toVoid(c){if(c.d.type==='token'){INST.delete(c.uid);return}resetCard(c);P[c.owner].void.push(c);for(const p of P){const n=p.field.filter(x=>x.id==='asura'&&!x.noAbil).length;if(n)gainXP(p,n,'Asura')}}
function resetCard(c){c.dmg=0;c.mods=[];c.equips=[];c.frozen=0;c.suspended=0;c.prison=null;c.curled=false;c.noAbil=false;c.flame=0;c.ctrl=c.owner;c.latency=true;c.atkUsed=0;c.copy=null;c.shieldBy=null;c.doom=false;c.wait=0;c.trainBonus=false;c.noBlock=-1}
function enterField(p,c,o={}){resetCard(c);c.ctrl=p.id;c.noAbil=!!o.noAbil;c.latency=!c.d.kw.includes('agil')||c.noAbil;c.wait=c.noAbil?0:(c.d.wait||0);c.temp=!!o.temp;p.field.push(c);return c}
function summonToken(p,id,o={}){const c=mk(id,p.id);enterField(p,c,o);log(`${p.name} cria a ficha ${c.d.name}.`);return c}
async function equipToGrave(e){const o=P[e.owner];if(e.d.type==='omnita'){toGrave(e);return}toGrave(e);if(e.id==='asas'&&o.grave.includes(e)&&o.hp>1){const yes=o.isAI?o.hp>6:await asHuman(o,()=>ask('Asas Mecânicas',[{label:'Pagar 1 de vida e recuperar',value:true,primary:true},{label:'Não',value:false}],{text:'As Asas Mecânicas foram para o cemitério.'}));if(yes){removeFrom(o.grave,e);o.hand.push(e);damagePlayer(o,1,null,'Asas Mecânicas');log('Asas Mecânicas voltam para a mão.')}}}
async function leaveField(c){const p=P[c.ctrl];removeFrom(p.field,c);const eqs=c.equips;c.equips=[];for(const e of eqs)await equipToGrave(e)}
async function destroy(c,info={}){
  if(!onField(c))return;
  const p=P[c.ctrl];
  if(c.id==='deusaApolia'&&!c.noAbil&&!info.combat&&!info.force&&!info.sba){log('Deusa Apólia não pode ser destruída por efeitos.');return}
  // Estátua de Pedra de Gaia (simplificada)
  if(!info.combat&&!info.force&&isAnimal(c.d)&&p.totems.some(t=>t.id==='estatua')&&p.hand.length){
    const yes=p.isAI?val(c)>=5:await asHuman(p,()=>ask('Estátua de Pedra de Gaia',[{label:'Descartar 1 carta e salvar',value:true,primary:true},{label:'Deixar ser destruído',value:false}],{text:`${c.d.name} seria destruído. Descartar uma carta para evitar?`}));
    if(yes){await discardChoose(p,1,'Estátua: descarte 1 carta');c.dmg=0;c.mods=c.mods.filter(m=>m.d>=0);log(`A Estátua protege ${c.d.name}.`);if(def(c)>0)return}
  }
  const k=kws(c);
  await leaveField(c);
  log(`✖ ${c.d.name} é destruído.`,'dmg');
  if(!c.noAbil&&c.d.death)await c.d.death(c,p,info);
  if(info.toVoid)toVoid(c);else{toGrave(c);if(c.id==='fenix'&&P[c.owner].grave.includes(c))P[c.owner].fenix.push(c)}
  const killer=info.killer||(!info.combat&&!info.force?G.effSrc:null);
  if(k.has('consumir')&&killer&&killer!==c&&killer.d&&killer.d.cont==='Apólia'){log(`☀ A luz de ${killer.d.name} repele o Consumir do Vazio.`)}
  else if(k.has('consumir')&&killer&&killer!==c){
    if(onField(killer)){log(`Consumir: ${c.d.name} leva ${killer.d.name} junto!`,'atk');await destroy(killer,{})}
    else{const tp=P.find(q=>q.totems.includes(killer));if(tp){removeFrom(tp.totems,killer);toGrave(killer);log(`Consumir: ${c.d.name} leva ${killer.d.name} junto!`,'atk')}}
  }
}
async function banish(c){if(!onField(c))return;await leaveField(c);log(`${c.d.name} é enviado ao vazio.`);toVoid(c)}
async function sba(){let again=true,guard=0;while(again&&guard++<30){again=false;for(const c of allField())if(onField(c)&&(c.dmg>=def(c)||def(c)<=0)){await destroy(c,{sba:true});again=true}}}
async function hit(t,n,src){if(!t)return;if(t.isPlayer){damagePlayer(t,n,null,src);return}if(!onField(t))return;if(G.fire&&hasKw(t,'rescalor')){n=Math.max(0,n-1);log(`❄ ${t.d.name} resiste ao fogo (-1 de dano).`)}else if(G.fire&&hasKw(t,'voar')){n+=1;log(`🔥 As asas de ${t.d.name} pegam fogo (+1 de dano).`)}t.dmg+=n;log(`${t.d.name} recebe ${n} de dano (${src}).`,'dmg');floatTxt(t,`-${n}`);await sba()}
function checkOver(){if(G.over)return true;const lost=P.filter(p=>p.hp<=0||p.decked);if(!lost.length)return false;G.over=true;const winner=lost.length===2?null:P.find(p=>!lost.includes(p));setTimeout(()=>gameOver(winner),400);return true}

/* ============================ CANCELAR JOGADA ======================== */
const CANCEL=Symbol('cancel');
const canAbort=p=>!!(G&&G.cancellable&&!p.isAI);
function afterChoice(r){if(r===CANCEL)throw CANCEL;if(G)G.cancellable=false;return r}

/* ===================== MODO 2 JOGADORES (passar a vez) ============== */
let FOCUS_DEPTH=0;
function focus(p){return new Promise(res=>{
  if(ONLINE()){res();return}
  if(!HOT()||p.isAI||VIEW===p.id){if(!p.isAI)VIEW=p.id;res();return}
  const m=document.createElement('div');m.className='pass-bg';
  m.innerHTML=`<div class="pass"><h2>Vez de ${esc(p.name)}</h2><p>Passe o computador para ${esc(p.name)}. A outra pessoa não deve olhar.</p><button class="btn primary">Estou pronto</button></div>`;
  m.querySelector('button').onclick=()=>{m.remove();VIEW=p.id;render();res()};
  document.body.appendChild(m)})}
async function asHuman(p,fn){
  if(p&&p.remote){REMOTE_CAP=true;let pr;try{pr=fn()}finally{REMOTE_CAP=false}return await pr}
  FOCUS_DEPTH++;
  try{await focus(p);render();return await fn()}
  finally{FOCUS_DEPTH--;if(FOCUS_DEPTH===0&&HOT()&&G&&!G.over&&P[G.active]&&!P[G.active].isAI&&VIEW!==G.active)await focus(P[G.active])}}

/* =========================== ESCOLHAS (UI/IA) ======================= */
function targetList(p,o){const out=[];const kind=o.kind||'any';
  if(kind==='any')out.push(opp(p),p);
  const fields=kind==='oppOmnita'?opp(p).field:kind==='myOmnita'?p.field:allField();
  for(const c of fields){if(o.instant&&hasKw(c,'runica'))continue;if(o.filter&&!o.filter(c))continue;out.push(c)}
  if(kind==='card'){for(const t of [...opp(p).totems,...p.totems])out.push(t)}
  return out}
function targetScore(p,t,o){
  if(t.isPlayer){if(t===p)return -50;if(o.dmg)return t.hp+t.prot<=o.dmg?200:t.hp+t.prot<=8?12:4;return -1}
  if(o.buff)return t.ctrl===p.id?(t===G.aiFocus?60:5+val(t)/4):-30;
  const enemy=t.ctrl!==p.id;
  if(o.destroy)return enemy?10+val(t):-20;
  if(o.dmg){const left=def(t)-t.dmg;if(!enemy)return -20;return left<=o.dmg?12+val(t):1}
  return enemy?5:-5}
function bestTargetScore(p,o){const ts=targetList(p,o);if(!ts.length)return 0;const s=Math.max(...ts.map(t=>targetScore(p,t,o)));return s>=10?s:0}
async function pickTarget(p,o){
  const ts=targetList(p,o);if(!ts.length){log('Nenhum alvo válido.');return null}
  if(p.isAI){let best=null,bs=-1e9;for(const t of ts){const s=targetScore(p,t,o);if(s>bs){bs=s;best=t}}if(o.optional&&bs<=0)return null;if(best)log(`→ alvo: ${best.isPlayer?best.name:best.d.name}`);return best}
  const opts=ts.map(t=>t.isPlayer?{label:t===p?`Você (${t.hp} ❤)`:`${t.name} (${t.hp} ❤)`,value:t,primary:t!==p}:{card:t,value:t,label:t.ctrl===p.id?'seu':'oponente'});
  return afterChoice(await asHuman(p,()=>ask(o.title,opts,{cancel:o.optional?'Nenhum':null,abort:canAbort(p)})))}
async function chooseCard(p,title,cards,o={}){
  if(!cards.length)return null;
  if(p.isAI){const f=o.ai||val;return[...cards].sort((a,b)=>f(b)-f(a))[0]}
  return afterChoice(await asHuman(p,()=>ask(title,cards.map(c=>({card:c,value:c})),{cancel:o.optional?'Nenhuma':null,abort:canAbort(p)})))}
async function chooseMulti(p,title,cards,min,max,o={}){
  if(p.isAI)return(o.ai?o.ai():cards.slice(0,min)).slice(0,max);
  return afterChoice(await asHuman(p,()=>askMulti(title,cards,min,max,canAbort(p))))}
async function search(p,filter,title,o={}){
  const from=o.from||['deck'];const dest=o.dest===undefined?'hand':o.dest;
  const cands=[];for(const z of from)for(const c of p[z])if(filter(c))cands.push(c);
  if(!cands.length){log('Nenhuma carta encontrada.');if(from.includes('deck'))shuffle(p.deck);return null}
  const c=await chooseCard(p,title,cands,{optional:true,ai:x=>(x.d.lvl<=level(p)+1?10:0)+val(x)});
  if(c){for(const z of from)if(removeFrom(p[z],c))break;if(dest==='hand'){p.hand.push(c);log(`${p.name} adiciona ${p.isAI||SECRET()?'uma carta':c.d.name} à mão.`)}}
  if(from.includes('deck'))shuffle(p.deck);return c}
async function discardChoose(p,n,title){n=Math.min(n,p.hand.length);if(!n)return;
  const cs=p.isAI?[...p.hand].sort((a,b)=>aiCardValue(p,a)-aiCardValue(p,b)).slice(0,n):await asHuman(p,()=>askMulti(title,p.hand,n,n));
  for(const c of cs){removeFrom(p.hand,c);toGrave(c)}log(`${p.name} descarta ${cs.map(c=>c.d.name).join(', ')}.`)}

/* ============================ JOGAR CARTAS ========================== */
function equipTargets(p,d){const pool=d.eqAny?allField():p.field;return pool.filter(c=>c.d.type!=='token'||true).filter(c=>!d.eqFilter||d.eqFilter(c))}
function whyNot(p,c,win){
  const d=c.d,L=level(p);
  if(G.over)return'Fim de jogo';
  if(win){
    if(d.type!=='instant')return'Só Execuções Instantâneas agora';
    if(d.lvl>L)return`Requer nível ${d.lvl}`;
    if(win.type==='spell'){if(win.card.d.type==='knowledge')return'Conhecimento não pode ser anulado';if(d.counter==='any')return null;if(d.counter==='nonOmnita')return win.card.d.type!=='omnita'?null:'Só anula cartas não-omnita';if(d.id==='primeirosSocorros')return win.card.d.type==='instant'?null:'Só em resposta a Execução Instantânea';return'Não é uma resposta'}
    if(win.type==='attack'){if(d.id==='planta')return def(win.att)<=3?null:'Atacante tem defesa maior que 3';if(d.atkWin&&d.responseOnly)return d.can&&!d.can(p,c)?'Condição não atendida':null;if(d.responseOnly||d.counter)return'Não pode ser usada agora';if(d.can&&!d.can(p,c))return'Condição não atendida';return null}
    if(win.type==='camo')return d.id==='camuflagem'?null:'—';
    if(win.type==='block')return d.blkWin?null:'—';
    return'—'}
  if(G.active!==p.id)return'Não é seu turno';
  if(d.responseOnly||d.counter)return'Só pode ser usada em resposta';
  if(G.phase==='combat'&&d.type!=='instant')return'Na fase de combate só Execuções Instantâneas';
  if(d.type==='omnita'){if(p.noSummon)return'Você não pode baixar omnitas neste turno';if(p.sumUsed+d.lvl>L)return`Níveis disponíveis para invocar: ${L-p.sumUsed} (precisa ${d.lvl})`}
  else if(d.lvl>L)return`Requer nível ${d.lvl} (você é nível ${L})`;
  if(d.type==='knowledge'&&p.knowUsed)return'Apenas 1 Conhecimento por turno';
  if(d.type==='equip'&&!equipTargets(p,d).length)return'Nenhum omnita válido para equipar';
  if(d.can&&!d.can(p,c))return'Condição da carta não atendida';
  return null}
const canPlay=(p,c,win)=>!whyNot(p,c,win);

async function playCard(p,c,win=null){
  const hp0=p.hp,xp0=p.xp,sum0=p.sumUsed,know0=p.knowUsed,played0=p.played;
  G.cancellable=!p.isAI;
  try{return await playCardInner(p,c,win)}
  catch(e){if(e!==CANCEL)throw e;
    for(const z of ['hand','grave','void'])removeFrom(p[z],c);p.hand.push(c);
    p.hp=hp0;p.xp=xp0;p.sumUsed=sum0;p.knowUsed=know0;p.played=played0;
    log(`${d0(c)} — jogada cancelada.`);render();return false}
  finally{G.cancellable=false}}
const d0=c=>c.d.name;
async function playCardInner(p,c,win){
  const d=c.d;
  removeFrom(p.hand,c);
  if(!win&&G.active===p.id)p.played=(p.played||0)+1;
  log(`${p.name} joga ${d.name}.`);
  if(d.cost){const ok=await d.cost(p,c);if(!ok){p.hand.push(c);log('Cancelado.');render();return false}}
  let eqT=null,mountT=null;
  if(d.type==='equip'){eqT=await pickEquip(p,d);if(!eqT){p.hand.push(c);log('Cancelado.');render();return false}}
  if(d.type==='omnita'&&d.kw.includes('montaria')){const hosts=p.field.filter(isHumanoid);if(hosts.length){mountT=p.isAI?null:await asHuman(p,()=>ask(`${d.name}: Montaria`,[{label:'Colocar em campo',value:null,primary:true},...hosts.map(h=>({card:h,value:h,label:'Equipar como montaria'}))]))}}
  c.suspChoice=false;
  if(d.type==='omnita'&&d.susp&&!mountT){
    if(p.isAI)c.suspChoice=p.hp>=12&&opp(p).field.reduce((t,x)=>t+atk(x),0)<p.hp/2;
    else c.suspChoice=await asHuman(p,()=>ask(`${d.name}: como baixar?`,[{label:'Baixar normal',value:false,primary:true},{label:`Baixar suspensa (${d.susp.t} turnos, ${d.susp.txt})`,value:true}],{preview:c,text:'Suspensa: a carta fica revelada ao oponente e entra em jogo depois, com o efeito extra.',cancel:'Cancelar'}));
    if(c.suspChoice==null)throw CANCEL;
    if(c.suspChoice)log(`⏳ ${p.name} baixa ${d.name} suspensa por ${d.susp.t} turnos (${d.susp.txt}).`)}
  if(d.type==='omnita')p.sumUsed+=d.lvl;
  if(d.type==='knowledge')p.knowUsed=true;
  render();
  if(!win){const r=await responseWindow(opp(p),p,c);if(r){render();return true}}
  if(G.over)return true;
  // resolução
  if(d.type==='omnita'){
    if(c.suspChoice){p.delayed.push({t:d.susp.t,label:d.name,uid:c.uid,susp:true,fn:async()=>{enterField(p,c);log(`⏳ ${d.name} sai da suspensão e entra em jogo.`);await d.susp.bonus(c,p);if(d.enter){G.effSrc=c;try{await d.enter(c,p)}finally{G.effSrc=null}}}})}
    else if(d.suspendOnPlay){p.delayed.push({t:d.suspendOnPlay,label:d.name,fn:async()=>{enterField(p,c);c.mods.push({a:2,d:3});log(`${d.name} entra em jogo com +2/+3!`)}});log(`${d.name} fica suspenso por ${d.suspendOnPlay} turnos.`)}
    else if(mountT&&onField(mountT)){resetCard(c);c.ctrl=p.id;mountT.equips.push(c);log(`${d.name} é equipado como montaria em ${mountT.d.name}.`)}
    else{enterField(p,c);if(d.enter){G.effSrc=c;try{await d.enter(c,p)}finally{G.effSrc=null}}}
  }else if(d.type==='equip'){if(onField(eqT)){eqT.equips.push(c);log(`${d.name} equipado em ${eqT.d.name}.`)}else toGrave(c)}
  else if(d.type==='totem'){p.totems.push(c)}
  else{
    G.fire=!!(d.burn&&d.type==='instant');
    try{if(d.dmg){const t=await pickTarget(p,{title:`${d.name}: ${d.dmg} de dano`,dmg:d.dmg,instant:d.type==='instant'});if(t)await hit(t,d.dmg,d.name)}
    else if(d.play)await d.play(p,c);}finally{G.fire=false}
    if(!p.grave.includes(c)&&!p.void.includes(c))toGrave(c);
    if(d.type==='instant'&&d.burn){for(const m of allField())if(m.id==='mestreChamas'&&!m.noAbil){m.flame=(m.flame||0)+1;log('Mestre Kaldraniano das Chamas ganha +1/+0.')}}
  }
  const xp=d.xpGeodo?0:d.xpRoll?await roll(6,d.name):cardXP(d);if(d.xpRoll)log(`d6 = ${xp}`);
  gainXP(p,xp);
  if(d.prot){addProt(p,d.prot);log(`🛡 ${p.name} recebe ${d.prot} de Proteção (dura ${RULES.protTurns} turnos).`,'heal')}
  await sba();checkOver();render();return true}
async function pickEquip(p,d){const ts=equipTargets(p,d);if(!ts.length)return null;
  if(p.isAI){if(d.id==='coleira')return opp(p).field.length?[...opp(p).field].sort((a,b)=>atk(b)-atk(a))[0]:null;const mine=ts.filter(c=>c.ctrl===p.id);return mine.sort((a,b)=>val(b)-val(a))[0]||null}
  return await asHuman(p,()=>ask(`${d.name}: escolha o omnita`,ts.map(c=>({card:c,value:c,label:c.ctrl===p.id?'seu':'oponente'})),{cancel:'Cancelar'}))}

/* resposta a uma carta jogada pelo oponente (anular etc.). retorna true se anulada */
async function responseWindow(R,caster,card){
  const win={type:'spell',card};
  const opts=card.d.type==='knowledge'?[]:R.hand.filter(x=>canPlay(R,x,win));
  let pick=null;
  if(!R.isAI&&(!opts.length&&(SETTINGS.skipNoResponse||R.remote)))return false;
  if(R.isAI&&!opts.length)return false;
  if(R.isAI){
    if(G.diff==='facil')return false;
    const big=card.d.type==='omnita'?card.d.lvl>=4:(card.d.burn||['erupcao','nevasca','mina','espolio','encarar','malNecessario','perdido','coracaoAth','coracaoKurai','crescimento','espadaNegra','protRunica'].includes(card.id)||card.d.lvl>=3);
    pick=opts.find(x=>x.d.counter==='any'&&big)||opts.find(x=>x.d.counter==='nonOmnita'&&big)||opts.find(x=>x.id==='primeirosSocorros'&&R.hp<RULES.startHP)||null;
    if(pick)await sleep(AUTO?0:400);
  }else{
    pick=await asHuman(R,()=>askResponse(R,caster,card,opts));
  }
  if(!pick)return false;
  removeFrom(R.hand,pick);log(`↯ ${R.name} responde com ${pick.d.name}!`,'atk');
  if(pick.d.counter){
    log(`${card.d.name} é anulada!`,'atk');
    if(card.d.type==='omnita'&&caster.sumUsed>=card.d.lvl){/* invocação já gasta */}
    if(pick.d.counter==='any')toVoid(card);else toGrave(card);
    toGrave(pick);gainXP(R,pick.d.xp);
    if(pick.id==='desintegrar')draw(caster,1);
    checkOver();return true}
  await pick.d.play(R,pick);toGrave(pick);gainXP(R,pick.d.xp);return false}

/* ============================== COMBATE ============================= */
function canAttack(c){const p=P[c.ctrl];return !G.over&&G.active===p.id&&G.phase==='combat'&&onField(c)&&!c.latency&&!c.frozen&&!c.suspended&&!isPrisoned(c)&&!c.curled&&c.atkUsed<(hasKw(c,'golpe')?2:1)&&atk(c)>0}
function canBlock(b,att){if(b.ctrl===att.ctrl||!onField(b)||b.noBlock===G.turnNo||b.blockedTurn===G.turnNo||b.frozen||b.suspended||isPrisoned(b))return false;const k=kws(att);if(k.has('imbloqueavel'))return false;if(k.has('voar')){const kb=kws(b);return kb.has('voar')||kb.has('alcance')}return true}
const offPos=c=>c.attackedTurn!==undefined&&c.attackedTurn===G.turnNo-1&&G.active!==c.ctrl;   // Fora de Posição
const minBlockers=att=>hasKw(att,'obstinacao')?2:1;
async function attack(att){
  const A=P[att.ctrl],D=opp(A);G.busy=true;att.atkUsed++;att.attackedTurn=G.turnNo;G.curAtt=att;G.cancelAttack=false;G.redirect=null;
  log(`⚔ ${att.d.name} (${atk(att)}/${def(att)}) ataca!`,'atk');render();flash(att);
  if(att.equips.some(e=>e.id==='coleira'))damagePlayer(A,1,null,'Coleira de Controle');
  if(G.over)return;
  let blks=await defend(D,att);
  for(const b of blks)b.blockedTurn=G.turnNo;   // já bloqueou neste turno
  // Fora de Posição: quem atacou no último turno rola 1d6 para conseguir bloquear (1-3 bloqueia, 4-6 falha)
  if(blks.some(b=>offPos(b)&&b.forcedT!==G.turnNo)){let kept=[];
    for(const b of blks){if(offPos(b)&&b.forcedT!==G.turnNo){const r=await roll(6,`${b.d.name}: fora de posição (1–3 bloqueia)`);floatTxt(b,`🎲 ${r}`);
      if(r<=3)log(`🎲 ${b.d.name} está fora de posição e rola ${r}: chega a tempo e bloqueia!`,'atk');
      else{log(`🎲 ${b.d.name} está fora de posição e rola ${r}: não chega a tempo, o bloqueio falha!`,'atk');continue}}
      kept.push(b)}
    if(kept.length&&kept.length<minBlockers(att)){log('Bloqueadores insuficientes para a Obstinação: o bloqueio falha.','atk');kept=[]}
    blks=kept;render()}
  if(G.over)return;
  // janela de bloqueio: cartas que quebram a regra (Facho de Luz Solar)
  if(onField(att)&&!G.cancelAttack&&blks.length)await blockWindow(D,att,blks);
  if(onField(att)&&!G.cancelAttack){
    await animateAttack(att,G.redirect?[G.redirect]:blks.filter(onField),D);
    if(G.redirect){const t=G.redirect;if(onField(t)){log(`O ataque de ${att.d.name} é desviado para ${t.d.name}!`,'atk');await hit(t,atk(att),'Facho de Luz Solar')}}

/* ======================= INSTANTÂNEO (Voltar no Tempo) ============== */
const PKEYS=['deck','hand','field','totems','grave','void','fenix'];
function snapshot(){
  const inst=[];for(const[u,c]of INST)inst.push([c,{...c,mods:c.mods.map(m=>({...m})),equips:[...c.equips],copy:c.copy?{...c.copy}:null}]);
  const ps=P.map(p=>{const o={hp:p.hp,xp:p.xp,prot:p.prot,protQ:(p.protQ||[]).map(x=>({...x})),noSummon:p.noSummon,decked:p.decked,dots:p.dots.map(x=>({...x})),hots:p.hots.map(x=>({...x})),delayed:p.delayed.map(x=>({...x}))};for(const k of PKEYS)o[k]=[...p[k]];return o});
  return{inst,ps};
}
function restore(s){
  INST.clear();for(const[c,v]of s.inst){Object.assign(c,v);INST.set(c.uid,c)}
  P.forEach((p,i)=>{const o=s.ps[i];for(const k of PKEYS)p[k]=[...o[k]];p.hp=o.hp;p.xp=o.xp;p.prot=o.prot;p.protQ=(o.protQ||[]).map(x=>({...x}));p.noSummon=o.noSummon;p.decked=o.decked;p.dots=o.dots.map(x=>({...x}));p.hots=o.hots.map(x=>({...x}));p.delayed=o.delayed.map(x=>({...x}))});
}
function swingScore(p){ // quanto o último turno do oponente prejudicou p
  const s=G.snap&&G.snap[p.id];if(!s)return 0;const o=opp(p),me=s.ps[p.id],them=s.ps[o.id];
  const mine=new Set(p.field),theirs=new Set(o.field);
  const lost=me.field.filter(c=>!mine.has(c)).reduce((t,c)=>t+(c.d.atk||0)+(c.d.def||0)+c.d.lvl*1.5,0);
  const gained=o.field.filter(c=>!them.field.includes(c)).reduce((t,c)=>t+val(c),0);
  return (me.hp+me.prot-p.hp-p.prot)*2+lost+gained*0.5+(o.xp-them.xp)*0.5;
}

async function startTurn(p){
  if(G.over)return;
  G.active=p.id;G.turnNo++;G.phase='main1';
  log(`— Turno ${G.turnNo}: ${p.name} —`,'t');
  if(!await turnBegin(p))return;

}
async function turnBegin(p){

  expireProt(p);
  {const n=p.totems.filter(t=>t.id==='circuitosProt').length;if(n){addProt(p,n);log(`🛡 Circuitos de Proteção: +${n} de Proteção.`,'heal')}}
  for(const e of p.grave.filter(x=>x.id==='estatuaViva')){if(p.xp<2)break;const yes=p.isAI?p.hand.length<4:await asHuman(p,()=>ask('Estátua Viva de Apólia',[{label:'Pagar 2 XP e recuperar',value:true,primary:true},{label:'Não',value:false}],{text:'Recuperar a Estátua Viva do cemitério para a mão?',preview:e}));if(yes){p.xp-=2;removeFrom(p.grave,e);p.hand.push(e);log(`${p.name} paga 2 XP e recupera a Estátua Viva.`)}}
  for(const d of p.dots){damagePlayer(p,d.n,null,d.src);d.t--}p.dots=p.dots.filter(d=>d.t>0);
  for(const h of p.hots){heal(p,h.n,h.src);h.t--}p.hots=p.hots.filter(h=>h.t>0);
  if(checkOver())return false;
  const due=[];for(const d of p.delayed){d.t--;if(d.t<=0)due.push(d)}p.delayed=p.delayed.filter(d=>d.t>0);
  for(const d of due)await d.fn();

  await sba();

  return true;
}
async function endTurn(){

function lordeFeed(c,p){
  if(!c||!onField(c)||c.latency||c.frozen||isPrisoned(c)||c.atkUsed)return[];
  const o=opp(p);const blockers=o.field.filter(b=>canBlock(b,c));
  const fodder=p.field.filter(x=>x!==c&&(x.latency||x.d.type==='token'||val(x)<=6)).sort((a,b)=>atk(b)-atk(a));
  const pick=[];let a=atk(c);for(const x of fodder){if(a>=o.hp+o.prot)break;pick.push(x);a+=atk(x)}
  if(a>=o.hp+o.prot&&!blockers.length)return pick;
  if(G.diff==='dificil'&&!blockers.length){const extra=p.field.filter(x=>x!==c&&(x.latency||x.d.type==='token')).slice(0,3);if(extra.reduce((t,x)=>t+atk(x),0)>=3)return extra}
  return[]}
function aiCardValue(p,c){const d=c.d;if(d.type==='knowledge')return 30+(d.xp||3);if(d.type==='omnita')return 10+d.lvl*3+(d.lvl>level(p)+2?-8:0);return 15+(d.lvl||0)}
function aiScore(p,c){
  const d=c.d;if(!canPlay(p,c))return 0;
  if(d.type==='knowledge')return 100+(d.xp||3);
  if(d.type==='omnita'){if(d.id==='fenix'&&p.grave.filter(x=>x.d.type==='instant').length<2)return 0;if(d.id==='kraken'&&!p.field.some(x=>val(x)<8))return 0;if(d.id==='dragaoGelo'&&p.hand.length<5)return 0;if(d.id==='bruxaVideira'&&!opp(p).field.length)return 5;return 30+d.lvl*4+(+d.atk||0)+(+d.def||0)}
  if(d.type==='equip'){if(d.ai)return d.ai(p,c);return p.field.length?12+d.lvl:0}
  if(d.ai)return d.ai(p,c);
  if(d.type==='totem')return 12;
  return 0}
async function aiMain(p){
  for(let g=0;g<25&&!G.over;g++){
    let best=null,bs=0;
    for(const c of p.hand){const s=aiScore(p,c);if(s>bs){bs=s;best={c}}}
    for(const c of [...p.field,...p.totems]){const a=abilityOf(c);if(a&&canUseAbility(p,c)){const s=a.ai?a.ai(p,c):0;if(s>bs){bs=s;best={a:c}}}}
    if(G.diff==='facil'){const cand=p.hand.filter(c=>aiScore(p,c)>=8);best=cand.length?{c:cand[rnd(cand.length)]}:null}
    if(!best||bs<8&&G.diff!=='facil')break;
    await sleep(650/SPEED*(AUTO?0.02:1));
    if(best.c){if(!await playCard(p,best.c))break}else await useAbility(p,best.a);
    render();
  }}
async function aiCombat(p){
  const order=()=>p.field.filter(canAttack).sort((a,b)=>atk(b)-atk(a));
  for(let g=0;g<20&&!G.over;g++){
    const D=opp(p);let chosen=null;
    if(G.diff==='facil'){chosen=order()[0]||null}else
    for(const att of order()){
      const bl=D.field.filter(b=>canBlock(b,att));if(bl.length<minBlockers(att)){chosen=att;break}
      const deadly=bl.some(b=>atk(b)>=def(att)-att.dmg&&atk(att)<def(b)-b.dmg);
      const lethal=D.hp<=p.field.filter(canAttack).reduce((s,c)=>s+atk(c),0);

    }
    if(!chosen)break;

    await attack(chosen);
  }}
async function aiTurn(p){
  const g=G;G.busy=true;render();
  await sleep(500*(AUTO?0.02:1));
  await aiMain(p);if(G.over||g!==G)return;
  setPhase('combat');await aiCombat(p);if(G.over||g!==G)return;

function canUseAbility(p,c){const a=abilityOf(c);if(!a||G.over)return false;if(G.active!==p.id||G.phase==='combat')return false;if(c.ctrl!==p.id)return false;if(c.usedTurn===G.turnNo)return false;if(c.d.type!=='totem'&&(c.frozen||isPrisoned(c)||c.suspended))return false;if(a.can&&!a.can(c,p))return false;return true}
async function useAbility(p,c){const a=abilityOf(c);const prev=c.usedTurn;c.usedTurn=G.turnNo;G.cancellable=!p.isAI;G.effSrc=c;
  try{await a.run(c,p);log(`${p.name} usa ${c.d.name}: ${a.label}.`)}
  catch(e){if(e!==CANCEL)throw e;c.usedTurn=prev;log(`${c.d.name} — habilidade cancelada.`);render();return}
  finally{G.effSrc=null;G.cancellable=false}await sba();checkOver();render()}

  m.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${o.text?`<p>${esc(o.text)}</p>`:''}${o.preview?`<div style="display:flex;justify-content:center;margin-bottom:6px">${cardHTML(o.preview)}</div>`:''}<div class="opts"></div>${o.cancel?`<button class="btn cancel">${esc(o.cancel)}</button>`:''}${o.abort?' <button class="btn danger abort">✕ Cancelar</button>':''}</div>`;
  const box=m.querySelector('.opts');
  for(const op of options){let el;if(op.card){el=document.createElement('div');el.className='opt-card';el.innerHTML=cardHTML(op.card)+(op.label?`<div class="optlbl">${esc(op.label)}</div>`:'')}else{el=document.createElement('button');el.className='btn'+(op.primary?' primary':'');el.textContent=op.label}

const RULES_HTML=`<ul>
<li><b>Objetivo:</b> reduzir a vida do oponente (20) a 0. Quem precisar comprar sem cartas no baralho perde.</li>
<li><b>Experiência e nível:</b> toda carta jogada com sucesso dá a XP indicada (canto superior direito). Nível 1: 0–5 XP · 2: 6–10 · 3: 11–15 · 4: 16–25 · 5: 26–35 · 6: 36–50 · 7: 51–70 · 8: 71+.</li>
<li><b>Invocação:</b> a soma dos níveis dos omnitas baixados no turno não pode passar do seu nível. Outras cartas exigem nível ≥ ao nível da carta.</li>
<li><b>Conhecimento:</b> apenas 1 por turno, não pode ser anulado.</li>
<li><b>Latência:</b> omnitas recém-baixados só atacam no próximo turno.</li>
<li><b>Combate:</b> você declara um atacante; o oponente escolhe bloquear ou receber o dano direto. Vários omnitas podem bloquear o mesmo atacante; ele divide o dano entre eles. Cada omnita só pode bloquear um ataque por turno. O dano que sobra não passa para o jogador. Cada omnita ataca uma vez por turno (Golpe Duplo: duas).</li>
<li>🌐 <b>Online:</b> um jogador cria a sala e envia o código; o outro digita o código e entra. Cada um vê só a própria mão.</li>
<li>📱 <b>No celular:</b> toque numa carta da mão para levantá-la e toque de novo para jogar. Segure o dedo numa carta para ver a carta grande com todos os detalhes.</li>
<li><b>Voar:</b> só pode ser bloqueado por Voar ou Alcance.</li>
<li><b>Suspender N</b> ⏳: ao jogar a carta, escolha baixá-la normal ou suspensa. Suspensa, ela fica revelada ao oponente e entra em jogo depois de N turnos seus, com o efeito extra indicado.</li>
<li><b>Fora de Posição</b> 🎲: um omnita que atacou no seu último turno está longe da defesa. Se ele bloquear no turno do oponente, jogue 1d6: 1–3 ele chega a tempo e bloqueia; 4–6 o bloqueio falha e o ataque segue (para os outros bloqueadores ou direto no jogador).</li>
<li><b>Proteção:</b> absorve o dano antes da vida. Cada Proteção ganha dura ${RULES.protTurns} turnos seus: no início do seu 2º turno depois de recebê-la, o que sobrou dela some. O dano gasta primeiro a Proteção mais antiga.</li>
<li><b>Ciclo dos continentes</b> (🔴 Atharvash vence 🟢 Gaia, que vence 🟡 Apólia, que vence 🔵 Kurai, que vence 🔴 Atharvash):
 <br>🔥 <b>Fogo</b>: o dano de Execuções de queimar ignora a Proteção, e voadores recebem +1.
 <br>🔥 <b>Queimadura</b> (habilidade de alguns omnitas do Atharvash): quem recebe dano deles não recupera vida até o fim do seu próximo turno.
 <br>🌿 <b>Atropelar</b> da Gaia: o dano que sobra atravessa a Proteção.
 <br>☀ <b>Luz</b>: o Consumir do Vazio não leva omnitas de Apólia junto.
 <br>❄ <b>Resistência ao Calor</b> (habilidade de alguns omnitas do Kurai): recebem 1 a menos de dano de fogo e de omnitas do Atharvash.</li>
<li><b>Execuções Instantâneas</b> podem ser usadas no seu turno ou em resposta ao oponente (quando ele joga uma carta ou ataca). <b>Execuções Regulares</b> só nas fases Inicial/Final do seu turno.</li>
<li>Clique numa carta brilhante da mão para jogá-la; no combate, clique num omnita com brilho vermelho para atacar. Omnitas/totens com habilidade ficam clicáveis.</li></ul>`;

async function doAct(H,act,c){
  if(G.over||G.busy||G.active!==H.id)return;
  if(act==='combat'){if(G.phase==='main1')setPhase('combat');return}
  if(act==='main2'){if(G.phase==='combat')setPhase('main2');return}
  if(act==='attackall'){for(let i=0;i<40&&!G.over;i++){const a=H.field.filter(canAttack).sort((x,y)=>atk(y)-atk(x))[0];if(!a)break;await attack(a)}render();return}
  if(act==='end'){await endTurn();return}
  if(!c)return;
  if(act==='play'){if(!H.hand.includes(c))return;const why=whyNot(H,c);if(why){log(`✋ ${c.d.name}: ${why}.`);render();return}G.busy=true;await playCard(H,c);if(!G.over)G.busy=false;render();return}
  if(act==='attack'){if(c.ctrl!==H.id||!canAttack(c))return;await attack(c);return}
  if(act==='ability'){if(!canUseAbility(H,c))return;G.busy=true;const a2=abilityOf(c);const yes=await asHuman(H,()=>ask(c.d.name,[{label:a2.label,value:true,primary:true},{label:'Cancelar',value:false}],{preview:c}));if(yes)await useAbility(H,c);if(!G.over)G.busy=false;render();return}
}

async function netInit(){if(NET.db)return;const B='https://cdn.jsdelivr.net/npm/firebase@10.12.2/';

const genCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let x='';for(let i=0;i<5;i++)x+=A[rnd(A.length)];return x};
function netEnc(v,tbl){
  if(v===CANCEL)return{__x:1};if(v===undefined)return undefined;if(v===null)return null;
  const t=typeof v;if(t==='function'||t==='symbol')return undefined;if(t!=='object')return v;
  if(typeof Element!=='undefined'&&v instanceof Element)return undefined;
  if(v.isPlayer)return{__p:v.id};
  if(v.d&&v.uid!==undefined){if(tbl&&tbl[v.uid]===undefined){tbl[v.uid]=0;const o={};for(const k in v){if(k==='d')continue;const x=netEnc(v[k],tbl);if(x!==undefined)o[k]=x}tbl[v.uid]=o}return{__c:v.uid}}
  if(Array.isArray(v))return v.map(x=>{const y=netEnc(x,tbl);return y===undefined?null:y});
  const o={};for(const k in v){const x=netEnc(v[k],tbl);if(x!==undefined)o[k]=x}return o}
function netDec(v,getC){if(v===null||typeof v!=='object')return v;if(v.__c!==undefined)return getC(v.__c);if(v.__p!==undefined)return P[v.__p];if(v.__x)return CANCEL;
  if(Array.isArray(v))return v.map(x=>netDec(x,getC));const o={};for(const k in v)o[k]=netDec(v[k],getC);return o}
function serState(){const tbl={};const ps=P.map(p=>{const o={};for(const k in p){const x=netEnc(p[k],tbl);if(x!==undefined)o[k]=x}return o});
  const g={};for(const k in G){if(k==='snap'||k==='aiFocus')continue;const x=netEnc(G[k],tbl);if(x!==undefined)g[k]=x}
  return JSON.stringify({P:ps,G:g,C:tbl,L:LOGBUF.slice(-80)})}
function netSend(m){if(!NET.ref)return;NET.ref.child(NET.role==='host'?'toGuest/m':'toHost/m').push(m).catch(e=>console.warn(e))}
function netFlushNow(){if(NET.role!=='host'||!G||!ONLINE()||!NET.ref)return;clearTimeout(NET.tmr);NET.tmr=null;const st=serState();if(st===NET.last)return;NET.last=st;NET.ref.child('toGuest/s').set(st).catch(e=>console.warn(e))}
function netFlushSoon(){if(NET.role!=='host'||!G||!ONLINE())return;if(!NET.tmr)NET.tmr=setTimeout(netFlushNow,150)}
